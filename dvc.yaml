stages:
  # Raw session photos -> cropped bean-tray images. Iterates over *sessions*
  # rather than class directories: a session is the unit that gets added to this
  # project over time, so a new capture session is a one-line change here.
  # Crop settings live in dataset/<session>.crop.yaml and are declared as a dep,
  # not a param -- they describe a rig, not the model, so they must not enter the
  # hyperparameter surface or the experiments table.
  crop:
    foreach:
      - 2026-08-07__box_pictures_all_classes
      - 2026-08-09__pixel_cam
      - 2026-08-09__sony_cam
      - 2026-08-25__iphone
      - 2026-08-25__oneplus
      - 2026-08-27__oneplus_flash
      - 2026-08-30__oneplus
      - 2026-08-30__pixel
      - 2026-08-30__sony
    do:
      cmd: python -m coffeecv.crop_session --session ${item}
      deps:
        - dataset/${item}
        - dataset/${item}.crop.yaml
        - coffeecv/crop_tray.py
        - coffeecv/crop_session.py
      outs:
        - data/cropped/${item}

  # The capture dirs training reads (dataset.CAPTURES): one pool per camera model,
  # merged from that camera's sessions -- box_0807 and pixel_cam_0809 are the same
  # Pixel 9 Pro at two framing distances, so they share a pool. Three of the four
  # carry all ten classes, because each camera's 08-30 class_010 session folds into
  # its own pool; cam_iphone has eight. Each pool spans framing distances (cam_pixel
  # covers 87-362 px bean pitch).
  #
  # Since ticket ML-1 (2026-09-29) these are photo pools, not labels: photos are
  # pooled across all four per class before the train/val/test split, and no pool
  # is held out. The legacy merge_oneplus stage (oneplus_combined) was deleted then
  # too (D6); cam_oneplus supersedes it.
  merge_cam_pixel:
    cmd: python -m coffeecv.merge_rig --name cam_pixel --sessions 2026-08-07__box_pictures_all_classes 2026-08-09__pixel_cam 2026-08-30__pixel
    deps:
      - data/cropped/2026-08-07__box_pictures_all_classes
      - data/cropped/2026-08-09__pixel_cam
      - data/cropped/2026-08-30__pixel
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_pixel

  merge_cam_sony:
    cmd: python -m coffeecv.merge_rig --name cam_sony --sessions 2026-08-09__sony_cam 2026-08-30__sony
    deps:
      - data/cropped/2026-08-09__sony_cam
      - data/cropped/2026-08-30__sony
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_sony

  merge_cam_oneplus:
    cmd: python -m coffeecv.merge_rig --name cam_oneplus --sessions 2026-08-25__oneplus 2026-08-27__oneplus_flash 2026-08-30__oneplus
    deps:
      - data/cropped/2026-08-25__oneplus
      - data/cropped/2026-08-27__oneplus_flash
      - data/cropped/2026-08-30__oneplus
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_oneplus

  merge_cam_iphone:
    cmd: python -m coffeecv.merge_rig --name cam_iphone --sessions 2026-08-25__iphone
    deps:
      - data/cropped/2026-08-25__iphone
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_iphone

  train:
    cmd: python -m coffeecv.train_baseline
    deps:
      - coffeecv
      # The capture dirs training actually reads -- params.yaml's
      # train_capture_dirs, which rests at dataset.CAPTURES -- so the DAG runs
      # merge_cam_* (and the crops behind them) before train, and a changed pool
      # invalidates the run. Until ticket ML-1 this listed raw-session crop dirs
      # and the legacy oneplus_combined instead of the cam_* pools, so a change
      # to a pool did not invalidate train at all. Point train_capture_dirs at a
      # dir not listed here and add it here too, or a changed dir reuses a
      # stale run.
      - data/cropped/cam_pixel
      - data/cropped/cam_sony
      - data/cropped/cam_oneplus
      - data/cropped/cam_iphone
      - dataset/classes.txt
    params:
      - params.yaml:
    outs:
      - outputs/checkpoints/best.pt
      - outputs/checkpoints/last.pt
      # Full per-class detail. Deliberately an `out`, not a `metric`: DVC
      # flattens every leaf of a metrics file into its own column, and this
      # file's nested per-class stats expand to 140+ of them, which makes both
      # `dvc exp show` and the VS Code Experiments table unreadable. Kept
      # git-tracked (see .gitignore) and archived per run under experiments/.
      - outputs/metrics.json:
          cache: false
    metrics:
      # The only file DVC reports as a metric: six flat numbers, so the
      # experiments table and `dvc metrics diff` stay scannable.
      - outputs/summary.json:
          cache: false
    plots:
      - outputs/history.json:
          x: epoch
          y: train_loss
      - outputs/history.json:
          x: epoch
          y: val_loss
      - outputs/history.json:
          x: epoch
          y: val_macro_f1
      # LR per param group (training_curves.png draws the same two on a log scale). `lr` is the head
      # group and exists in every history; lr_backbone only in runs made since 2026-09-20, so DVC
      # warns about that one field until history.json is next overwritten.
      - outputs/history.json:
          x: epoch
          y: lr
      - outputs/history.json:
          x: epoch
          y: lr_backbone
      - outputs/predictions_val.csv:
          template: confusion
          x: true_label
          y: pred_label
      - outputs/predictions_test.csv:
          template: confusion
          x: true_label
          y: pred_label

  # Ticket ML-2 P3 (plan §2.4, §6): the segmenter's crops, the training half of the "segment" crop_method
  # (infer.segment_bean_region is the serving half; both run segment_beans.segment_and_crop). Per raw photo:
  # the filled D4 crop and its bean mask, or the whole photo on a D18 fallback. The segmenter is params.yaml's
  # seg_* fields. Mask bits differ across CPUs and thread counts (P0), so this runs on the VM at a pinned 4
  # threads, like seg_predict. The existing crop / merge_cam_* stages stay untouched until P6 (ticket R7).
  segcrop:
    foreach:
      - 2026-08-07__box_pictures_all_classes
      - 2026-08-09__pixel_cam
      - 2026-08-09__sony_cam
      - 2026-08-25__iphone
      - 2026-08-25__oneplus
      - 2026-08-27__oneplus_flash
      - 2026-08-30__oneplus
      - 2026-08-30__pixel
      - 2026-08-30__sony
    do:
      cmd: python -m coffeecv.segcrop_session --session ${item} --threads 4
      deps:
        - dataset/${item}
        - coffeecv/segcrop_session.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - models_pretrained/${seg_weights}
        - ${seg_decoder}
      params:
        - params.yaml:
            - seg_weights
            - seg_weights_sha256
            - seg_decoder
            - seg_decoder_sha256
            - seg_prompt
            - seg_mask_select
            - seg_keep_frac
            - seg_min_area_frac
      outs:
        - data/segcropped/${item}

  # The segmenter's capture dirs (dataset.SEG_CAPTURES), merged exactly as merge_cam_* merges the tray
  # heuristic's; merge_rig copies each crop's bean mask with it (F3).
  merge_segcam_pixel:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_pixel --sessions 2026-08-07__box_pictures_all_classes 2026-08-09__pixel_cam 2026-08-30__pixel
    deps:
      - data/segcropped/2026-08-07__box_pictures_all_classes
      - data/segcropped/2026-08-09__pixel_cam
      - data/segcropped/2026-08-30__pixel
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_pixel

  merge_segcam_sony:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_sony --sessions 2026-08-09__sony_cam 2026-08-30__sony
    deps:
      - data/segcropped/2026-08-09__sony_cam
      - data/segcropped/2026-08-30__sony
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_sony

  merge_segcam_oneplus:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_oneplus --sessions 2026-08-25__oneplus 2026-08-27__oneplus_flash 2026-08-30__oneplus
    deps:
      - data/segcropped/2026-08-25__oneplus
      - data/segcropped/2026-08-27__oneplus_flash
      - data/segcropped/2026-08-30__oneplus
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_oneplus

  merge_segcam_iphone:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_iphone --sessions 2026-08-25__iphone
    deps:
      - data/segcropped/2026-08-25__iphone
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_iphone

  # Ticket ML-2 P1/P5: masks for the eval lists (seg_eval, neg_seg_eval, pos_seg_eval), computed once and
  # stored -- mask bits differ by a few pixels across CPUs and thread counts (P0), so this runs on the VM at
  # a pinned 4 threads and nothing downstream recomputes a mask. The photos are not deps: each one's
  # sha256 is in photo_lists.yaml and checked before use. `ft` joins at P5.
  seg_predict:
    foreach:
      pretrained:
        weights: models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
    do:
      cmd: python -m coffeecv.seg_predict ${key} --threads 4
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml2/photo_lists.yaml
        - ${item.weights}
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks/${key}

  # Ticket ML-2 P5: L0 encoder embeddings (fp16) of every label photo in each seg_ft view, with its label in the
  # same 512 frame (coffeecv/seg_finetune.py). Labels: data/seg_labels (seg_labels.py, the judge loop; dvc add,
  # built outside repro, D16). Several GB and rebuildable, so never pushed (plan §2.3).
  seg_embed_cache:
    cmd: python -m coffeecv.seg_finetune cache --threads 4
    deps:
      - coffeecv/seg_finetune.py
      - coffeecv/sam_loader.py
      - third_party/efficientvit/efficientvit
      - labels/ml2/photo_lists.yaml
      - data/seg_labels
      - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
    params:
      - params.yaml:
          - seg_split_seed
          - seg_ft.views
          - seg_ft.neg_select_frac
    outs:
      - data/seg_cache:
          push: false

  # Ticket ML-2 P5 (D7 (a)): decoder-only fine-tuning, one seed each; the epoch is chosen on seg_val and the
  # held seg-train negatives only. The .json card (params, label-set hash, history) is versioned in git.
  seg_finetune:
    foreach: [42, 123, 7]
    do:
      cmd: python -m coffeecv.seg_finetune train --seed ${item} --threads 4
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/seg_cache
        - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
      params:
        - params.yaml:
            - seg_ft
            - seg_prompt
            - seg_mask_select
            - seg_min_area_frac
      outs:
        - models/seg/ft_s${item}.pt
        - models/seg/ft_s${item}.json:
            cache: false

  # Ticket ML-2 P5: the eval lists' masks from each fine-tuned segmenter, as seg_predict@pretrained (same lists,
  # same pinned threads), for judging (seg_judge judge --masks ft_s<seed>) and seg_eval@ft_s<seed>.
  seg_predict_ft:
    foreach: [42, 123, 7]
    do:
      cmd: python -m coffeecv.seg_predict ft_s${item} --threads 4
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml2/photo_lists.yaml
        - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
        - models/seg/ft_s${item}.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks/ft_s${item}

  # Ticket ML-2 P2/P5: score a seg_predict stage's stored masks against the judge's stored verdicts (D16).
  # Never calls the judge: a mask with no verdict for the pinned judge stops the stage, naming the masks to
  # judge (python -m coffeecv.seg_judge judge --masks <model>). Also the judge-free heuristic comparison (D22),
  # the D18 tiny-mask threshold and the D19 pitch check, which decodes the accepted photos (sha256-checked
  # in photo_lists.yaml, so not deps) and their data/cropped pool JPEGs.
  seg_eval:
    foreach:
      - pretrained
      - ft_s42
      - ft_s123
      - ft_s7
    do:
      cmd: python -m coffeecv.seg_eval ${item}
      deps:
        - coffeecv/seg_eval.py
        - coffeecv/segment_beans.py
        - coffeecv/bean_scale.py
        - labels/ml2/photo_lists.yaml
        - labels/ml2/verdicts.jsonl
        - labels/ml2/judge_prompt.md
        - labels/ml2/accept_rule.md
        - data/seg_masks/${item}
        - data/cropped
      params:
        - params.yaml:
            - safety_margin
            - bean_k_lo
            - bean_k_hi
            - bean_analysis_frac
            - bean_calibration_k
            - seg_min_area_frac
      outs:
        - outputs/ml2_p2/${item}
      metrics:
        - outputs/seg_eval_${item}.json:
            cache: false
