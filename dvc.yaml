stages:
  # Ticket ML-3 P2b (Q3, owner 2026-10-04): the tray heuristic's stages -- the `crop` foreach (raw session ->
  # data/cropped/<session>, settings in dataset/<session>.crop.yaml) and merge_cam_* (data/cropped/cam_*) --
  # are retired, with their pools. Training reads the segmenter's crops only (segcrop, merge_segpool below).
  # They are in git history up to ML-3 P2b's parent, and an older commit plus `dvc checkout` brings them back.
  # The ResNet trainer's `train` stage (outputs/checkpoints, metrics.json, summary.json, history.json) was removed
  # on 2026-10-20 with its code; its last run is in git history and dvc.lock before then.
  # ML-2's segmenter stages (seg_predict, seg_embed_cache, seg_finetune, seg_predict_ft, seg_predict_ml3_new,
  # seg_eval: labels/ml2's lists, the L0 fine-tunes models/seg/ft_s*) and ML-5's XL0-v1 and v2 (seg_ml5_cache,
  # seg_ml5_finetune, seg_ml5_predict@xl0_v1/v2: data/ml5_labels/pass1, pass2) were removed on 2026-10-21 with the
  # code only they ran (owner); they are in git history and dvc.lock before then, their outputs in the DVC cache.

  # Ticket ML-2 P3 (plan §2.4, §6): the segmenter's crops, the training half of the "segment" crop_method
  # (infer.segment_bean_region is the serving half; both run segment_beans.segment_and_crop). Per raw photo:
  # the filled D4 crop and its bean mask, or the whole photo on a D18 fallback. The segmenter is params.yaml's
  # seg_* fields. Mask bits differ across CPUs and thread counts (P0), so this runs on one machine at a pinned 4
  # threads, like seg_predict: the VM until it was shut down (2026-10-12), this host since (ML-6 D9). Since ticket
  # ML-3 P2b these are the only crops training reads.
  # Ticket ML-6 P6 (D21): segment_beans.py gained the xl0_v3 name (NAMED_SEGMENTERS), a change no stage's output
  # depends on. seg_ml5_predict@xl0_v1 was rerun and came back byte-identical (225 of 225 files); every segcrop
  # stage but random_date_raccoon (stale on its new photos until ML-6 D8) and seg_ml5_predict@xl0_v2 were then
  # recorded with `dvc commit`, not re-run. ML-6 P8 (D8 (a), 0675f40) then re-cropped every session with XL0-v3 on
  # this host. Ticket ML-8 P4 (D1, D3 (b)) re-cropped every session once more on 2026-10-19, XL0-v3 with today's code
  # (ML-7's ported mask code, which moves a few mask pixels), the 20 photos added to random_date_raccoon on 2026-10-17
  # and 2026-10-18 included; analysis/ml8/p4_recrop_report.txt compares it with P8's crops.
  segcrop:
    foreach:
      - 2026-08-07__box_pictures_all_classes
      - 2026-08-09__pixel_cam
      - 2026-08-09__sony_cam
      - 2026-08-25__iphone
      - 2026-08-25__oneplus
      - 2026-08-27__oneplus_flash
      - 2026-08-30__oneplus
      - 2026-08-30__pixel
      - 2026-08-30__sony
      # Ticket ML-3 P4: the new sessions (D5, D9), segmenter crop only.
      - 2026-09-11__oneplus
      - 2026-09-11__pixel
      - 2026-09-11__sony
      - 2026-09-24__oneplus
      - 2026-09-24__pixel
      - 2026-09-24__sony
      - random_date_raccoon
      # 2026-10-21: green Indonesia (class_015, a new coffee) and green Peru (class_011), Pixel 9 Pro.
      - 2026-10-21__new_green
    do:
      cmd: python -m coffeecv.segcrop_session --session ${item} --threads 4
      deps:
        - dataset/${item}
        - coffeecv/segcrop_session.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - models_pretrained/${seg_weights}
        - ${seg_decoder}
      params:
        - params.yaml:
            - seg_weights
            - seg_weights_sha256
            - seg_decoder
            - seg_decoder_sha256
            - seg_prompt
            - seg_mask_select
            - seg_keep_frac
            - seg_min_area_frac
      outs:
        - data/segcropped/${item}

  # The capture dir training reads (dataset.CAPTURES), ticket ML-8 (D2, D8; docs/adr/0024): one pool of every
  # session's crops, with no camera or rig. Photos are split per class across it (ML-1 D1(b)) and the patch budget is
  # per class over it. merge_rig copies each crop's bean mask with it (ML-2 F3) and leaves out the crops the owner
  # declined (labels/ml3/pool_exclude.csv: ML-3 P5 (D8), ML-8 P4 (D11)); the sessions' segcrop outs keep them. Until
  # ML-8 four stages, merge_segcam_{pixel,sony,oneplus,iphone}, merged one pool per camera model
  # (data/segcropped/cam_*, in git history and the DVC cache); until ML-3 P2b the tray heuristic's merge_cam_*.
  merge_segpool:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name pool --sessions 2026-08-07__box_pictures_all_classes 2026-08-09__pixel_cam 2026-08-09__sony_cam 2026-08-25__iphone 2026-08-25__oneplus 2026-08-27__oneplus_flash 2026-08-30__oneplus 2026-08-30__pixel 2026-08-30__sony 2026-09-11__oneplus 2026-09-11__pixel 2026-09-11__sony 2026-09-24__oneplus 2026-09-24__pixel 2026-09-24__sony random_date_raccoon 2026-10-21__new_green --exclude labels/ml3/pool_exclude.csv
    deps:
      - data/segcropped/2026-08-07__box_pictures_all_classes
      - data/segcropped/2026-08-09__pixel_cam
      - data/segcropped/2026-08-09__sony_cam
      - data/segcropped/2026-08-25__iphone
      - data/segcropped/2026-08-25__oneplus
      - data/segcropped/2026-08-27__oneplus_flash
      - data/segcropped/2026-08-30__oneplus
      - data/segcropped/2026-08-30__pixel
      - data/segcropped/2026-08-30__sony
      - data/segcropped/2026-09-11__oneplus
      - data/segcropped/2026-09-11__pixel
      - data/segcropped/2026-09-11__sony
      - data/segcropped/2026-09-24__oneplus
      - data/segcropped/2026-09-24__pixel
      - data/segcropped/2026-09-24__sony
      - data/segcropped/random_date_raccoon
      - data/segcropped/2026-10-21__new_green
      - labels/ml3/pool_exclude.csv
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/pool

  # Ticket ML-6 P6 (D4, D12, D15, D21, D22): XL0-v3, XL0-v2's recipe on the pass-3 labels, each sample augmented
  # as it trains (seg_ft.augment, docs/adr/0018-segmenter-fine-tunes-augment-on-the-fly.md), at 8 threads. Its own
  # stage because seg_ml5_finetune (XL0-v1, v2) was frozen whole. Deps (D22): the labels, whose labels.csv pins every photo's
  # sha256 (the run refuses a mismatch), not the photo folders or the dataset file, which change with every append.
  # Ticket ML-8 P2 (R7): the pipeline is built by coffeecv/augment.py's strict builder since then, the same 9 transforms
  # and a byte-identical seeded stream (tests/test_seg_finetune.py BuiltAsBefore); recorded with `dvc commit`, not re-run.
  # Frozen since ADR 0027 (2026-10-20): seg_ft.augment takes params.yaml's shared groups, so the block is the next
  # fine-tune's recipe, not XL0-v3's (its own is in dvc.lock and models/seg/xl0_v3.json); repro never reruns it.
  # The next fine-tune gets its own stage, with `augment` in its params beside seg_ft.
  seg_ml6_finetune:
    foreach:
      xl0_v3:
        labels: pass3
        seed: 123
    do:
      frozen: true
      cmd: python -m coffeecv.seg_finetune train --labels ${item.labels} --seed ${item.seed} --name ${key} --threads 8
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/augment.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/ml5_labels/${item.labels}
        - models_pretrained/${seg_ft.weights}
      params:
        - params.yaml:
            - seg_ft
            - seg_prompt
            - seg_mask_select
      outs:
        - models/seg/${key}.pt
        - models/seg/${key}.json:
            cache: false

  # Ticket ML-5 P8, P10 (D22): a fine-tuned segmenter's masks of every test photo, negatives included (their
  # empty-or-tiny rate), stored once at the pinned threads, for the blind paired session (seg_review paired).
  # ML-6 P6: xl0_v3 named in segment_beans.NAMED_SEGMENTERS (D21); xl0_v1 and v2 left with their stages on
  # 2026-10-21. Frozen 2026-10-20 (owner): the review's record,
  # made before ML-7 ported the mask code and ML-8 appended photos to the segmenter dataset (its test split has more
  # photos now than these masks). The next segmenter fine-tune predicts its test split beside XL0-v3's, afresh.
  seg_ml5_predict:
    foreach: [xl0_v3]
    do:
      frozen: true
      cmd: python -m coffeecv.seg_predict ${item} --split test --threads 4
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml5/seg_dataset.yaml
        - models_pretrained/${seg_ft.weights}
        - models/seg/${item}.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks_ml5/${item}

  # Ticket ML-9 P2: the next fine-tune, on the owner's pass-4 labels (carried from pass3: ML-8's appends and the
  # photos of 2026-10-21), with params.yaml's seg_ft whose augment takes the groups shared with the classifier
  # (ADR 0027; plan Q1). Its own stage, as seg_ml6_finetune is frozen with XL0-v3's recipe.
  seg_ml9_finetune:
    foreach:
      xl0_v4:
        labels: pass4
        seed: 123
      xl0_v4_s42:
        labels: pass4
        seed: 42
      xl0_v4_s7:
        labels: pass4
        seed: 7
    do:
      cmd: python -m coffeecv.seg_finetune train --labels ${item.labels} --seed ${item.seed} --name ${key} --threads 8
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/augment.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/ml5_labels/${item.labels}
        - models_pretrained/${seg_ft.weights}
      params:
        - params.yaml:
            - seg_ft
            - augment
            - seg_prompt
            - seg_mask_select
      outs:
        - models/seg/${key}.pt
        - models/seg/${key}.json:
            cache: false

  # Ticket ML-9 D8: XL0-v4's run at a third of its learning rate (seg_ft.lr 1e-4 -> 3e-5, `--lr`), all else the same
  # (labels, seed, params), after XL0-v4's validation score swung from epoch to epoch as XL0-v3's had. Its own stage,
  # so XL0-v4's command and params stay as they ran; `--lr` came after XL0-v4, which it leaves unchanged when absent
  # (tests/test_seg_finetune.py LearningRateArgument), so XL0-v4's new seg_finetune.py hash was recorded with `dvc
  # commit`, not re-run, as ML-8 P2 did for XL0-v3. Seeds 42 and 7 at both rates (D8, after) weigh the two rates over
  # seeds (ADR 0002); only the seed-123 runs predict test masks, until Q4 names another for P4. lr 3e-5 at seed 7 was
  # stopped by the owner in its epoch 10 (2026-10-23), tracking seeds 123 and 42 at 3e-5, both about 0.04 below every
  # 1e-4 seed; its item was removed with nothing written (plan P3b).
  seg_ml9_finetune_lr:
    foreach:
      xl0_v4_lr3e5:
        labels: pass4
        seed: 123
        lr: 3.0e-5
      xl0_v4_lr3e5_s42:
        labels: pass4
        seed: 42
        lr: 3.0e-5
    do:
      cmd: python -m coffeecv.seg_finetune train --labels ${item.labels} --seed ${item.seed} --lr ${item.lr} --name
        ${key} --threads 8
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/augment.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/ml5_labels/${item.labels}
        - models_pretrained/${seg_ft.weights}
      params:
        - params.yaml:
            - seg_ft
            - augment
            - seg_prompt
            - seg_mask_select
      outs:
        - models/seg/${key}.pt
        - models/seg/${key}.json:
            cache: false

  # Ticket ML-9 P2: both candidates' masks of today's test split (seg_ml5_predict's XL0-v3 masks predate ML-8's
  # appends), for the blind paired session of P4. XL0-v4 is passed as WEIGHTS:DECODER, so segment_beans.py, a dep
  # of every segcrop stage, changes only if it is adopted.
  # Frozen 2026-10-24 (owner): P4's record, made before the segmenter dataset appended the 6 positives of 2026-10-24
  # and their pool draw (its test split has 5 photos more than these masks).
  seg_ml9_predict:
    foreach:
      xl0_v3:
        model: xl0_v3
      xl0_v4:
        model: ${seg_ft.weights}:models/seg/xl0_v4.pt
      xl0_v4_lr3e5:
        model: ${seg_ft.weights}:models/seg/xl0_v4_lr3e5.pt
    do:
      frozen: true
      cmd: python -m coffeecv.seg_predict ${item.model} --split test --threads 4 --out data/seg_masks_ml9/${key}
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml5/seg_dataset.yaml
        - models_pretrained/${seg_ft.weights}
        - models/seg/${key}.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks_ml9/${key}

  # XL0-v5 (owner, 2026-10-25): XL0-v4's recipe on the owner's pass-7 labels, the re-review of every training and
  # validation label (seg_review --recheck pass6; 179 of 263 redrawn) and the positives of 2026-10-25. Only the
  # labels differ from seg_ml9_finetune@xl0_v4: params.yaml's seg_ft at lr 1e-4 (ML-9 D8), 8 threads. Seed 123
  # first, as XL0-v4; seeds 42 and 7 weigh it over seeds (ADR 0002), one run at a time (12 cores; ML-9 P3b).
  seg_xl0v5_finetune:
    foreach:
      xl0_v5:
        labels: pass7
        seed: 123
      xl0_v5_s42:
        labels: pass7
        seed: 42
      xl0_v5_s7:
        labels: pass7
        seed: 7
    do:
      cmd: python -m coffeecv.seg_finetune train --labels ${item.labels} --seed ${item.seed} --name ${key} --threads 8
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/augment.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/ml5_labels/${item.labels}
        - models_pretrained/${seg_ft.weights}
      params:
        - params.yaml:
            - seg_ft
            - augment
            - seg_prompt
            - seg_mask_select
      outs:
        - models/seg/${key}.pt
        - models/seg/${key}.json:
            cache: false

  # XL0-v5 against XL0-v4, the live segmenter, on today's test split, for the owner's blind paired review
  # (seg_review paired). Both afresh: seg_ml9_predict's masks are frozen and predate the appends of 2026-10-24 and
  # 2026-10-25. XL0-v5 is passed as WEIGHTS:DECODER, so segment_beans.py, a dep of every segcrop stage, changes only if
  # it is adopted.
  # Frozen 2026-10-27: the record the owner's blind paired sessions judged (xl0v5_test, xl0v5_seeds_test), made before
  # the segmenter dataset appended the 10 positives of 2026-10-26 and their pool draw (its test split has 4 photos more
  # than these masks).
  seg_xl0v5_predict:
    foreach:
      xl0_v4:
        model: ${seg_ft.weights}:models/seg/xl0_v4.pt
      xl0_v5:
        model: ${seg_ft.weights}:models/seg/xl0_v5.pt
      xl0_v5_s42:
        model: ${seg_ft.weights}:models/seg/xl0_v5_s42.pt
      xl0_v5_s7:
        model: ${seg_ft.weights}:models/seg/xl0_v5_s7.pt
    do:
      frozen: true
      cmd: python -m coffeecv.seg_predict ${item.model} --split test --threads 4 --out data/seg_masks_xl0v5/${key}
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml5/seg_dataset.yaml
        - models_pretrained/${seg_ft.weights}
        - models/seg/${key}.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks_xl0v5/${key}

  # ML-13 P5: XL0-v6, XL0-v5's recipe (params.yaml's seg_ft at lr 1e-4, 8 threads, seed 123) on the owner's pass10
  # labels: pass8's re-review of every training and validation label and, carried through pass9 and pass10, the 50
  # photos appended on 2026-10-28 (ticket D11). Labels are the one difference from seg_xl0v5_finetune@xl0_v5. One
  # seed (D3). Resumes after a reboot through `dvc repro -s` (P2).
  seg_xl0v6_finetune:
    foreach:
      xl0_v6:
        labels: pass10
        seed: 123
    do:
      cmd: python -m coffeecv.seg_finetune train --labels ${item.labels} --seed ${item.seed} --name ${key} --threads 8
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/augment.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/ml5_labels/${item.labels}
        - models_pretrained/${seg_ft.weights}
      params:
        - params.yaml:
            - seg_ft
            - augment
            - seg_prompt
            - seg_mask_select
      outs:
        - models/seg/${key}.pt
        - models/seg/${key}.json:
            cache: false

  # ML-13 P5 (R5): XL0-v5's and XL0-v6's masks of every test photo of the grown split (the 44 photos of 2026-10-27 and
  # their pool draw included), for the owner's blind paired review (D4). seg_xl0v5_predict is frozen, the record of
  # ML-12's sessions. XL0-v5's item first, while the owner labels pass8; XL0-v6's joins once it is fine-tuned.
  seg_xl0v6_predict:
    foreach:
      xl0_v5:
        model: ${seg_ft.weights}:models/seg/xl0_v5.pt
      xl0_v6:
        model: ${seg_ft.weights}:models/seg/xl0_v6.pt
    do:
      cmd: python -m coffeecv.seg_predict ${item.model} --split test --threads 4 --out data/seg_masks_xl0v6/${key}
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml5/seg_dataset.yaml
        - models_pretrained/${seg_ft.weights}
        - models/seg/${key}.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks_xl0v6/${key}

  # Ticket ML-7 D6 (plan P9): the shipped model converted for LiteRT, beside its checkpoint, as the release serves it
  # (coffeecv.export_litert): the graphs converted in convert/.venv (litert-torch needs torch below 2.14), then the
  # head, the manifest and D7's check on the CPU against PyTorch in this environment. --profile is the serving host's
  # accelerator and precision per graph (ADR 0019): gpu_split is yappy's; a new host is measured, then named here.
  # Live since 2026-10-27: dino3b16_segxl0v5_country_aug8_s42; the three above it are the releases before it.
  # Each model names the decoder its card was trained with (training_config.seg_decoder), which the export converts:
  # ticket ML-9's candidate is the first on XL0-v4, the XL0-v5 candidate (exp276) the first on XL0-v5.
  litert_export:
    foreach:
      allrigs_dino3b16_segxl0v3_country_s42: {seg: xl0_v3}
      dino3b16_segxl0v3_country_aug8_s123: {seg: xl0_v3}
      dino3b16_segxl0v4_country_aug8_s42: {seg: xl0_v4}
      dino3b16_segxl0v5_country_aug8_s42: {seg: xl0_v5}
    do:
      cmd: >-
        convert/.venv/bin/python -m coffeecv.export_litert convert --checkpoint models/${key}.pt --profile gpu_split
        && python -m coffeecv.export_litert finish --checkpoint models/${key}.pt --profile gpu_split
      deps:
        - coffeecv/export_litert.py
        - coffeecv/litert_forms.py
        - coffeecv/litert.py
        - convert/uv.lock
        - models/${key}.pt
        - models/${key}.json
        - models_pretrained/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
        - models_pretrained/efficientvit_sam/efficientvit_sam_xl0.pt
        - models/seg/${item.seg}.pt
      outs:
        - models/${key}.litert
