stages:
  # Ticket ML-3 P2b (Q3, owner 2026-10-04): the tray heuristic's stages -- the `crop` foreach (raw session ->
  # data/cropped/<session>, settings in dataset/<session>.crop.yaml) and merge_cam_* (data/cropped/cam_*) --
  # are retired, with their pools. Training reads the segmenter's pools only (segcrop, merge_segcam_* below).
  # They are in git history up to ML-3 P2b's parent, and an older commit plus `dvc checkout` brings them back.
  train:
    cmd: python -m coffeecv.train_baseline
    deps:
      - coffeecv
      # The capture dirs training actually reads -- params.yaml's
      # train_capture_dirs, which rests at dataset.CAPTURES -- so the DAG runs
      # merge_segcam_* (and the crops behind them) before train, and a changed pool
      # invalidates the run. Until ticket ML-1 this listed raw-session crop dirs
      # and the legacy oneplus_combined instead of the cam_* pools, so a change
      # to a pool did not invalidate train at all; until ticket ML-3 P2b, the tray
      # heuristic's data/cropped pools. Point train_capture_dirs at a dir not
      # listed here and add it here too, or a changed dir reuses a stale run.
      - data/segcropped/cam_pixel
      - data/segcropped/cam_sony
      - data/segcropped/cam_oneplus
      - data/segcropped/cam_iphone
      - dataset/classes.txt
    params:
      - params.yaml:
    outs:
      - outputs/checkpoints/best.pt
      - outputs/checkpoints/last.pt
      # Full per-class detail. Deliberately an `out`, not a `metric`: DVC
      # flattens every leaf of a metrics file into its own column, and this
      # file's nested per-class stats expand to 140+ of them, which makes both
      # `dvc exp show` and the VS Code Experiments table unreadable. Kept
      # git-tracked (see .gitignore) and archived per run under experiments/.
      - outputs/metrics.json:
          cache: false
    metrics:
      # The only file DVC reports as a metric: six flat numbers, so the
      # experiments table and `dvc metrics diff` stay scannable.
      - outputs/summary.json:
          cache: false
    plots:
      - outputs/history.json:
          x: epoch
          y: train_loss
      - outputs/history.json:
          x: epoch
          y: val_loss
      - outputs/history.json:
          x: epoch
          y: val_macro_f1
      # LR per param group (training_curves.png draws the same two on a log scale). `lr` is the head
      # group and exists in every history; lr_backbone only in runs made since 2026-09-20, so DVC
      # warns about that one field until history.json is next overwritten.
      - outputs/history.json:
          x: epoch
          y: lr
      - outputs/history.json:
          x: epoch
          y: lr_backbone
      - outputs/predictions_val.csv:
          template: confusion
          x: true_label
          y: pred_label
      - outputs/predictions_test.csv:
          template: confusion
          x: true_label
          y: pred_label

  # Ticket ML-2 P3 (plan §2.4, §6): the segmenter's crops, the training half of the "segment" crop_method
  # (infer.segment_bean_region is the serving half; both run segment_beans.segment_and_crop). Per raw photo:
  # the filled D4 crop and its bean mask, or the whole photo on a D18 fallback. The segmenter is params.yaml's
  # seg_* fields. Mask bits differ across CPUs and thread counts (P0), so this runs on the VM at a pinned 4
  # threads, like seg_predict. Since ticket ML-3 P2b these are the only crops training reads.
  segcrop:
    foreach:
      - 2026-08-07__box_pictures_all_classes
      - 2026-08-09__pixel_cam
      - 2026-08-09__sony_cam
      - 2026-08-25__iphone
      - 2026-08-25__oneplus
      - 2026-08-27__oneplus_flash
      - 2026-08-30__oneplus
      - 2026-08-30__pixel
      - 2026-08-30__sony
      # Ticket ML-3 P4: the new sessions (D5, D9), segmenter crop only.
      - 2026-09-11__oneplus
      - 2026-09-11__pixel
      - 2026-09-11__sony
      - 2026-09-24__oneplus
      - 2026-09-24__pixel
      - 2026-09-24__sony
      - random_date_raccoon
    do:
      cmd: python -m coffeecv.segcrop_session --session ${item} --threads 4
      deps:
        - dataset/${item}
        - coffeecv/segcrop_session.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - models_pretrained/${seg_weights}
        - ${seg_decoder}
      params:
        - params.yaml:
            - seg_weights
            - seg_weights_sha256
            - seg_decoder
            - seg_decoder_sha256
            - seg_prompt
            - seg_mask_select
            - seg_keep_frac
            - seg_min_area_frac
      outs:
        - data/segcropped/${item}

  # The capture dirs training reads (dataset.CAPTURES): one pool per camera model, merged from that camera's
  # sessions -- box_0807 and pixel_cam_0809 are the same Pixel 9 Pro at two framing distances, so they share
  # a pool. Since ticket ML-1 (2026-09-29) these are photo pools, not labels: photos are pooled across all
  # four per class before the train/val/test split, and no pool is held out. merge_rig copies each crop's
  # bean mask with it (ML-2 F3). Until ticket ML-3 P2b the tray heuristic's merge_cam_* stages built the
  # same four pools from its own crops. Ticket ML-3 P4 added the new sessions to the pools of their cameras
  # (D6): random_date_raccoon is the Pixel 9 Pro's; the iPhone took none, so cam_iphone is unchanged. Since
  # ML-3 P5 (D8, owner 2026-10-06) the three pools leave out the crops the owner declined
  # (labels/ml3/pool_exclude.csv, from analysis/ml3/mask_review.py exclude); the sessions' segcrop outs keep them.
  merge_segcam_pixel:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_pixel --sessions 2026-08-07__box_pictures_all_classes 2026-08-09__pixel_cam 2026-08-30__pixel 2026-09-11__pixel 2026-09-24__pixel random_date_raccoon --exclude labels/ml3/pool_exclude.csv
    deps:
      - data/segcropped/2026-08-07__box_pictures_all_classes
      - data/segcropped/2026-08-09__pixel_cam
      - data/segcropped/2026-08-30__pixel
      - data/segcropped/2026-09-11__pixel
      - data/segcropped/2026-09-24__pixel
      - data/segcropped/random_date_raccoon
      - labels/ml3/pool_exclude.csv
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_pixel

  merge_segcam_sony:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_sony --sessions 2026-08-09__sony_cam 2026-08-30__sony 2026-09-11__sony 2026-09-24__sony --exclude labels/ml3/pool_exclude.csv
    deps:
      - data/segcropped/2026-08-09__sony_cam
      - data/segcropped/2026-08-30__sony
      - data/segcropped/2026-09-11__sony
      - data/segcropped/2026-09-24__sony
      - labels/ml3/pool_exclude.csv
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_sony

  merge_segcam_oneplus:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_oneplus --sessions 2026-08-25__oneplus 2026-08-27__oneplus_flash 2026-08-30__oneplus 2026-09-11__oneplus 2026-09-24__oneplus --exclude labels/ml3/pool_exclude.csv
    deps:
      - data/segcropped/2026-08-25__oneplus
      - data/segcropped/2026-08-27__oneplus_flash
      - data/segcropped/2026-08-30__oneplus
      - data/segcropped/2026-09-11__oneplus
      - data/segcropped/2026-09-24__oneplus
      - labels/ml3/pool_exclude.csv
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_oneplus

  merge_segcam_iphone:
    cmd: python -m coffeecv.merge_rig --root data/segcropped --name cam_iphone --sessions 2026-08-25__iphone
    deps:
      - data/segcropped/2026-08-25__iphone
      - coffeecv/merge_rig.py
    outs:
      - data/segcropped/cam_iphone

  # Ticket ML-2 P1/P5: masks for the eval lists (seg_eval, neg_seg_eval, pos_seg_eval), computed once and
  # stored -- mask bits differ by a few pixels across CPUs and thread counts (P0), so this runs on the VM at
  # a pinned 4 threads and nothing downstream recomputes a mask. The photos are not deps: each one's
  # sha256 is in photo_lists.yaml and checked before use. `ft` joins at P5.
  # Ticket ML-5 P8: ML-2's segmenter stages below (seg_predict, seg_embed_cache, seg_finetune, seg_predict_ft,
  # seg_predict_ml3_new, seg_eval) are frozen, not deleted: their outputs stay tracked, models/seg/ft_s123.pt
  # first, which segcrop and serving use until P11, and repro never reruns them. They ran on L0, written out
  # here, from ML-2's lists and the code at a1e73e3. ML-5's own stages follow them (seg_ml5_*).
  seg_predict:
    foreach: [pretrained]
    do:
      frozen: true
      cmd: python -m coffeecv.seg_predict ${item} --threads 4
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml2/photo_lists.yaml
        - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks/${item}

  # Ticket ML-2 P5: encoder embeddings (fp16) of every label photo in each seg_ft view, with its label in the
  # same frame (coffeecv/seg_finetune.py; 512 for L0, 1024 for XL0, by seg_ft.weights' variant, ticket ML-5 P4).
  # Labels: data/seg_labels (seg_labels.py, the judge loop; dvc add, built outside repro, D16). Several GB and
  # rebuildable, so never pushed (plan §2.3).
  # Ticket ML-3 P3 (Q2, Q2a): the metadata strip changed every photo's sha256 (never its pixels), and the
  # re-keyed photo_lists.yaml and data/seg_labels were recorded here with `dvc commit`, not re-run. So
  # data/seg_cache/{index.csv, cache.json} and the label-set hash in models/seg/ft_s*.json keep values
  # derived from the pre-strip hashes (labels/ml3/strip_manifest.csv maps them), and a forced repro of this
  # stage would not reproduce its recorded outputs; the embeddings and decoders themselves are unchanged.
  seg_embed_cache:
    frozen: true
    cmd: python -m coffeecv.seg_finetune cache --threads 4
    deps:
      - coffeecv/seg_finetune.py
      - coffeecv/sam_loader.py
      - third_party/efficientvit/efficientvit
      - labels/ml2/photo_lists.yaml
      - data/seg_labels
      - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
    params:
      - params.yaml:
          - seg_split_seed
          - seg_ft.weights
          - seg_ft.views
          - seg_ft.neg_select_frac
    outs:
      - data/seg_cache:
          push: false

  # Ticket ML-2 P5 (D7 (a)): decoder-only fine-tuning, one seed each; the epoch is chosen on seg_val and the
  # held seg-train negatives only. The .json card (params, label-set hash, history) is versioned in git.
  # The label-set hash is over the pre-strip photo hashes (ticket ML-3 P3; see seg_embed_cache above): the
  # decoders are ML-2's own, kept rather than retrained (Q2a).
  seg_finetune:
    foreach: [42, 123, 7]
    do:
      frozen: true
      cmd: python -m coffeecv.seg_finetune train --seed ${item} --threads 4
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/seg_cache
        - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
      params:
        - params.yaml:
            - seg_ft
            - seg_prompt
            - seg_mask_select
            - seg_min_area_frac
      outs:
        - models/seg/ft_s${item}.pt
        - models/seg/ft_s${item}.json:
            cache: false

  # Ticket ML-2 P5: the eval lists' masks from each fine-tuned segmenter, as seg_predict@pretrained (same lists,
  # same pinned threads), for judging (seg_judge judge --masks ft_s<seed>) and seg_eval@ft_s<seed>.
  seg_predict_ft:
    foreach: [42, 123, 7]
    do:
      frozen: true
      cmd: python -m coffeecv.seg_predict ft_s${item} --threads 4
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml2/photo_lists.yaml
        - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt      # the base seg_finetune trains the decoders over
        - models/seg/ft_s${item}.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks/ft_s${item}

  # Ticket ML-3 P5 (D8): ft_s123's full-frame masks of the 288 new photos, for the owner's review. segcrop keeps
  # only crop-aligned masks; this recomputes the full-frame ones on the VM at the same 4 threads and stops unless
  # each equals the mask_sha256 segcrop recorded, so the owner judges exactly the masks training crops with.
  seg_predict_ml3_new:
    frozen: true
    cmd: python -m coffeecv.seg_predict_sessions ft_s123 --threads 4 --out ml3_new_ft_s123 --sessions 2026-09-11__oneplus 2026-09-11__pixel 2026-09-11__sony 2026-09-24__oneplus 2026-09-24__pixel 2026-09-24__sony random_date_raccoon
    deps:
      - coffeecv/seg_predict_sessions.py
      - coffeecv/seg_predict.py
      - coffeecv/segment_beans.py
      - coffeecv/sam_loader.py
      - third_party/efficientvit/efficientvit
      - models_pretrained/efficientvit_sam/efficientvit_sam_l0.pt
      - models/seg/ft_s123.pt
      - dataset/2026-09-11__oneplus
      - dataset/2026-09-11__pixel
      - dataset/2026-09-11__sony
      - dataset/2026-09-24__oneplus
      - dataset/2026-09-24__pixel
      - dataset/2026-09-24__sony
      - dataset/random_date_raccoon
      - data/segcropped/2026-09-11__oneplus
      - data/segcropped/2026-09-11__pixel
      - data/segcropped/2026-09-11__sony
      - data/segcropped/2026-09-24__oneplus
      - data/segcropped/2026-09-24__pixel
      - data/segcropped/2026-09-24__sony
      - data/segcropped/random_date_raccoon
    params:
      - params.yaml:
          - seg_prompt
          - seg_mask_select
    outs:
      - data/seg_masks/ml3_new_ft_s123

  # Ticket ML-2 P2/P5: score a seg_predict stage's stored masks against the judge's stored verdicts (D16).
  # Never calls the judge: a mask with no verdict for the pinned judge stops the stage, naming the masks to
  # judge (python -m coffeecv.seg_judge judge --masks <model>). Also the D18 tiny-mask threshold. Until ticket
  # ML-3 P2b it also ran the heuristic comparison (D22) and the D19 pitch check against the tray heuristic's
  # data/cropped pools, retired then; their results stay in the metrics files as of commit 8eef7f5.
  # Only pretrained and ft_s123: ML-2 judged the seed seg_val selected (123), so ft_s42's and ft_s7's masks
  # have no verdicts and their stages never ran; running them needs judge calls, which ML-3 D8 rules out.
  seg_eval:
    foreach:
      - pretrained
      - ft_s123
    do:
      frozen: true
      cmd: python -m coffeecv.seg_eval ${item}
      deps:
        - coffeecv/seg_eval.py
        - coffeecv/segment_beans.py
        - labels/ml2/photo_lists.yaml
        - labels/ml2/verdicts.jsonl
        - labels/ml2/judge_prompt.md
        - labels/ml2/accept_rule.md
        - data/seg_masks/${item}
      params:
        - params.yaml:
            - seg_min_area_frac
      outs:
        - outputs/ml2_p2/${item}
      metrics:
        - outputs/seg_eval_${item}.json:
            cache: false

  # Ticket ML-5 P8 (D8, D14, D15): the fine-tune on a labelling session's labels (coffeecv/seg_finetune.py).
  # seg_ml5_cache@<session>: encoder embeddings (fp16) of every training and validation photo the owner accepted,
  # and every negative, in each seg_ft view, labels in the encoder's frame (1024 for XL0). About 3.7 GB for pass1
  # and rebuildable, so not in DVC's cache (cache: false; on ext4 it would be a second full copy): the lock
  # records its hash only. seg_ml5_finetune@<name>: decoder-only, one seed (D15), box-only and box-plus-points batches through
  # seg_mask_select (D23); the checkpoint chosen on the validation split only. The .json card is in git.
  seg_ml5_cache:
    foreach: [pass1, pass2]
    do:
      cmd: python -m coffeecv.seg_finetune cache --labels ${item} --threads 4
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/ml5_labels/${item}
        - models_pretrained/${seg_ft.weights}
      params:
        - params.yaml:
            - seg_ft.weights
            - seg_ft.views
      outs:
        - data/seg_cache_ml5/${item}:
            cache: false

  seg_ml5_finetune:
    foreach:
      xl0_v1:
        labels: pass1
        seed: 123
      xl0_v2:                 # P10: on the owner's pass-2 labels, the recipe and selection rule unchanged
        labels: pass2
        seed: 123
    do:
      cmd: python -m coffeecv.seg_finetune train --labels ${item.labels} --seed ${item.seed} --name ${key} --threads 4
      deps:
        - coffeecv/seg_finetune.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - data/seg_cache_ml5/${item.labels}
        - models_pretrained/${seg_ft.weights}
      params:
        - params.yaml:
            - seg_ft
            - seg_prompt
            - seg_mask_select
      outs:
        - models/seg/${key}.pt
        - models/seg/${key}.json:
            cache: false

  # Ticket ML-5 P8, P10 (D22): a fine-tuned segmenter's masks of every test photo, negatives included (their
  # empty-or-tiny rate), stored once at the pinned threads, for the blind paired session (seg_review paired).
  seg_ml5_predict:
    foreach: [xl0_v1, xl0_v2]
    do:
      cmd: python -m coffeecv.seg_predict ${item} --split test --threads 4
      deps:
        - coffeecv/seg_predict.py
        - coffeecv/segment_beans.py
        - coffeecv/sam_loader.py
        - third_party/efficientvit/efficientvit
        - labels/ml5/seg_dataset.yaml
        - models_pretrained/${seg_ft.weights}
        - models/seg/${item}.pt
      params:
        - params.yaml:
            - seg_prompt
            - seg_mask_select
      outs:
        - data/seg_masks_ml5/${item}
