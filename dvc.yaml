stages:
  # Raw session photos -> cropped bean-tray images. Iterates over *sessions*
  # rather than class directories: a session is the unit that gets added to this
  # project over time, so a new capture session is a one-line change here.
  # Crop settings live in dataset/<session>.crop.yaml and are declared as a dep,
  # not a param -- they describe a rig, not the model, so they must not enter the
  # hyperparameter surface or the experiments table.
  crop:
    foreach:
      - 2026-08-07__box_pictures_all_classes
      - 2026-08-09__pixel_cam
      - 2026-08-09__sony_cam
      - 2026-08-25__iphone
      - 2026-08-25__oneplus
      - 2026-08-27__oneplus_flash
      - 2026-08-30__oneplus
      - 2026-08-30__pixel
      - 2026-08-30__sony
    do:
      cmd: python -m coffeecv.crop_session --session ${item}
      deps:
        - dataset/${item}
        - dataset/${item}.crop.yaml
        - coffeecv/crop_tray.py
        - coffeecv/crop_session.py
      outs:
        - data/cropped/${item}

  # The capture dirs training reads (dataset.CAPTURES): one pool per camera model,
  # merged from that camera's sessions -- box_0807 and pixel_cam_0809 are the same
  # Pixel 9 Pro at two framing distances, so they share a pool. Three of the four
  # carry all ten classes, because each camera's 08-30 class_010 session folds into
  # its own pool; cam_iphone has eight. Each pool spans framing distances (cam_pixel
  # covers 87-362 px bean pitch).
  #
  # Since ticket ML-1 (2026-09-29) these are photo pools, not labels: photos are
  # pooled across all four per class before the train/val/test split, and no pool
  # is held out. The legacy merge_oneplus stage (oneplus_combined) was deleted then
  # too (D6); cam_oneplus supersedes it.
  merge_cam_pixel:
    cmd: python -m coffeecv.merge_rig --name cam_pixel --sessions 2026-08-07__box_pictures_all_classes 2026-08-09__pixel_cam 2026-08-30__pixel
    deps:
      - data/cropped/2026-08-07__box_pictures_all_classes
      - data/cropped/2026-08-09__pixel_cam
      - data/cropped/2026-08-30__pixel
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_pixel

  merge_cam_sony:
    cmd: python -m coffeecv.merge_rig --name cam_sony --sessions 2026-08-09__sony_cam 2026-08-30__sony
    deps:
      - data/cropped/2026-08-09__sony_cam
      - data/cropped/2026-08-30__sony
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_sony

  merge_cam_oneplus:
    cmd: python -m coffeecv.merge_rig --name cam_oneplus --sessions 2026-08-25__oneplus 2026-08-27__oneplus_flash 2026-08-30__oneplus
    deps:
      - data/cropped/2026-08-25__oneplus
      - data/cropped/2026-08-27__oneplus_flash
      - data/cropped/2026-08-30__oneplus
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_oneplus

  merge_cam_iphone:
    cmd: python -m coffeecv.merge_rig --name cam_iphone --sessions 2026-08-25__iphone
    deps:
      - data/cropped/2026-08-25__iphone
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_iphone

  train:
    cmd: python -m coffeecv.train_baseline
    deps:
      - coffeecv
      # The capture dirs training actually reads -- params.yaml's
      # train_capture_dirs, which rests at dataset.CAPTURES -- so the DAG runs
      # merge_cam_* (and the crops behind them) before train, and a changed pool
      # invalidates the run. Until ticket ML-1 this listed raw-session crop dirs
      # and the legacy oneplus_combined instead of the cam_* pools, so a change
      # to a pool did not invalidate train at all. Point train_capture_dirs at a
      # dir not listed here and add it here too, or a changed dir reuses a
      # stale run.
      - data/cropped/cam_pixel
      - data/cropped/cam_sony
      - data/cropped/cam_oneplus
      - data/cropped/cam_iphone
      - dataset/classes.txt
    params:
      - params.yaml:
    outs:
      - outputs/checkpoints/best.pt
      - outputs/checkpoints/last.pt
      # Full per-class detail. Deliberately an `out`, not a `metric`: DVC
      # flattens every leaf of a metrics file into its own column, and this
      # file's nested per-class stats expand to 140+ of them, which makes both
      # `dvc exp show` and the VS Code Experiments table unreadable. Kept
      # git-tracked (see .gitignore) and archived per run under experiments/.
      - outputs/metrics.json:
          cache: false
    metrics:
      # The only file DVC reports as a metric: six flat numbers, so the
      # experiments table and `dvc metrics diff` stay scannable.
      - outputs/summary.json:
          cache: false
    plots:
      - outputs/history.json:
          x: epoch
          y: train_loss
      - outputs/history.json:
          x: epoch
          y: val_loss
      - outputs/history.json:
          x: epoch
          y: val_macro_f1
      # LR per param group (training_curves.png draws the same two on a log scale). `lr` is the head
      # group and exists in every history; lr_backbone only in runs made since 2026-09-20, so DVC
      # warns about that one field until history.json is next overwritten.
      - outputs/history.json:
          x: epoch
          y: lr
      - outputs/history.json:
          x: epoch
          y: lr_backbone
      - outputs/predictions_val.csv:
          template: confusion
          x: true_label
          y: pred_label
      - outputs/predictions_test.csv:
          template: confusion
          x: true_label
          y: pred_label
