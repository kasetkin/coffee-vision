stages:
  # Raw session photos -> cropped bean-tray images. Iterates over *sessions*
  # rather than class directories: a session is the unit that gets added to this
  # project over time, so a new capture session is a one-line change here.
  # Crop settings live in dataset/<session>.crop.yaml and are declared as a dep,
  # not a param -- they describe a rig, not the model, so they must not enter the
  # hyperparameter surface or the experiments table.
  crop:
    foreach:
      - 2026-08-07__box_pictures_all_classes
      - 2026-08-09__pixel_cam
      - 2026-08-09__sony_cam
      - 2026-08-25__iphone
      - 2026-08-25__oneplus
      - 2026-08-27__oneplus_flash
      - 2026-08-30__oneplus
      - 2026-08-30__pixel
      - 2026-08-30__sony
    do:
      cmd: python -m coffeecv.crop_session --session ${item}
      deps:
        - dataset/${item}
        - dataset/${item}.crop.yaml
        - coffeecv/crop_tray.py
        - coffeecv/crop_session.py
      outs:
        - data/cropped/${item}

  # 2026-08-25__oneplus and 2026-08-27__oneplus_flash are two sessions of the same
  # physical rig (same phone, different day/framing/lighting -- see that session's
  # crop.yaml) that are meant to be trained on as ONE logical "oneplus" rig, not
  # two. Not part of the `crop` foreach above: that's a 1:1 session->output shape,
  # this is many:1. Kept as its own real, tracked stage rather than a manual copy
  # for the same reason `crop` itself became a stage (see that block's comment).
  merge_oneplus:
    cmd: python -m coffeecv.merge_rig --name oneplus_combined --sessions 2026-08-25__oneplus 2026-08-27__oneplus_flash
    deps:
      - data/cropped/2026-08-25__oneplus
      - data/cropped/2026-08-27__oneplus_flash
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/oneplus_combined

  # Camera-model rigs. A "rig" is the camera body and its processing pipeline,
  # not the capture session: box_0807 and pixel_cam_0809 are the same Pixel 9 Pro
  # shot at two framing distances, and counting them as independent rigs
  # overstated how many cameras this dataset actually covers.
  #
  # Three of the four now carry all ten classes, because each camera's 08-30
  # class_010 session folds into its own pool. That structurally removes the
  # one-class folds that run_folds had to exclude by hand -- there is no longer
  # any rig whose held-out split contains a single class.
  #
  # What this deliberately pools is framing distance: cam_pixel spans 87-362 px
  # bean pitch. That is the cost of the definition, and it is the axis the
  # camera-vs-framing decomposition says camera does NOT explain (29% of pitch
  # variance, against framing's 54%).
  merge_cam_pixel:
    cmd: python -m coffeecv.merge_rig --name cam_pixel --sessions 2026-08-07__box_pictures_all_classes 2026-08-09__pixel_cam 2026-08-30__pixel
    deps:
      - data/cropped/2026-08-07__box_pictures_all_classes
      - data/cropped/2026-08-09__pixel_cam
      - data/cropped/2026-08-30__pixel
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_pixel

  merge_cam_sony:
    cmd: python -m coffeecv.merge_rig --name cam_sony --sessions 2026-08-09__sony_cam 2026-08-30__sony
    deps:
      - data/cropped/2026-08-09__sony_cam
      - data/cropped/2026-08-30__sony
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_sony

  merge_cam_oneplus:
    cmd: python -m coffeecv.merge_rig --name cam_oneplus --sessions 2026-08-25__oneplus 2026-08-27__oneplus_flash 2026-08-30__oneplus
    deps:
      - data/cropped/2026-08-25__oneplus
      - data/cropped/2026-08-27__oneplus_flash
      - data/cropped/2026-08-30__oneplus
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_oneplus

  merge_cam_iphone:
    cmd: python -m coffeecv.merge_rig --name cam_iphone --sessions 2026-08-25__iphone
    deps:
      - data/cropped/2026-08-25__iphone
      - coffeecv/merge_rig.py
    outs:
      - data/cropped/cam_iphone

  train:
    cmd: python -m coffeecv.train_baseline
    deps:
      - coffeecv
      # The cropped tree, not the raw session: training reads only crops, so this
      # is what the DAG must depend on. Before Phase 9 this pointed at the raw
      # photos while the crops were dvcignored, which made the pipeline
      # unreproducible anywhere the crops didn't already exist on disk.
      #
      # All three rigs are deps regardless of which one params.yaml holds out:
      # the leave-one-rig-out fold is a *parameter* change, so a fold that swaps
      # the held-out rig must invalidate the stage. Listing only the current
      # fold's rigs would let a fold switch reuse a stale run.
      - data/cropped/2026-08-07__box_pictures_all_classes
      - data/cropped/2026-08-09__pixel_cam
      - data/cropped/2026-08-09__sony_cam
      # iPhone and oneplus_combined: used as train_rigs by run_folds.py's local
      # 5-way sweep (RIGS now lists 5 rigs, not 3 -- see that file) and as
      # --extra-heldout targets. Listed here for the same reason the three
      # above are listed regardless of the current fold: any heldout_rig or
      # train_rigs entry this stage might point at has to be a tracked dep, or
      # a fold that switches to it reuses a stale run (see the comment above).
      - data/cropped/2026-08-25__iphone
      - data/cropped/oneplus_combined
      - data/cropped/2026-08-30__oneplus
      - data/cropped/2026-08-30__pixel
      - data/cropped/2026-08-30__sony
      - dataset/classes.txt
    params:
      - params.yaml:
    outs:
      - outputs/checkpoints/best.pt
      - outputs/checkpoints/last.pt
      # Full per-class detail. Deliberately an `out`, not a `metric`: DVC
      # flattens every leaf of a metrics file into its own column, and this
      # file's nested per-class stats expand to 140+ of them, which makes both
      # `dvc exp show` and the VS Code Experiments table unreadable. Kept
      # git-tracked (see .gitignore) and archived per run under experiments/.
      - outputs/metrics.json:
          cache: false
    metrics:
      # The only file DVC reports as a metric: six flat numbers, so the
      # experiments table and `dvc metrics diff` stay scannable.
      - outputs/summary.json:
          cache: false
    plots:
      - outputs/history.json:
          x: epoch
          y: train_loss
      - outputs/history.json:
          x: epoch
          y: val_loss
      - outputs/history.json:
          x: epoch
          y: val_macro_f1
      # The Phase 11 chart that matters: in-distribution val against the held-out
      # rig, epoch by epoch. A model that learns the rig rather than the bean
      # shows here as the two curves separating.
      - outputs/history.json:
          x: epoch
          y: xrig_macro_f1
      - outputs/predictions_val.csv:
          template: confusion
          x: true_label
          y: pred_label
      - outputs/predictions_test.csv:
          template: confusion
          x: true_label
          y: pred_label
      - outputs/predictions_xrig.csv:
          template: confusion
          x: true_label
          y: pred_label
