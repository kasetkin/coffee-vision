# Parameters of coffeecv's data, segmenter and frozen-head fit. Read by coffeecv/config.py (RunConfig, strict:
# a key it does not define is refused); DVC stages list the keys they depend on.

seed: 7

# Training reads the cropped tree produced by the `segcrop` stage, not the raw
# session. The segmenter it runs is the seg_* block below.
#
# train_capture_dirs: the photo pool training draws from -- one, data/segcropped/pool,
# every session's crops merged by the merge_segpool stage (dataset.CAPTURES; ticket ML-8
# D2, ADR 0024: no camera or rig in the data or training pipeline). Photos are split
# train/val/test within each class (country) only (ML-1 D1(b)). Until ML-8 these were four camera pools
# (data/segcropped/cam_*, one merge_segcam_* stage each); until ticket ML-3 P2b the tray
# heuristic's data/cropped pools.
train_capture_dirs:
  - data/segcropped/pool
# One line per coffee in the D15 format (id;Country[,Region];Misc); the class is the
# country, so a class pools every folder of its country (ticket ML-3).
classes_file: dataset/classes.txt

# Patch geometry
patch_crop_size: 900
patch_resize: 224
patch_store_size: 448  # 0 = keep full patch_crop_size (single-rig legacy behaviour)
safety_margin: 0.97
# Per class, over the class's photos in the split (ticket ML-8 D8: today's four-pool volume, every
# class equal); until ML-8 150/40/40 per class *per capture dir*.
train_patches_per_class: 600
val_patches_per_class: 160
test_patches_per_class: 160

# Photo-level split, as fractions of however many photos a class has in the
# pool (ML-1 D1(b)); `python -m coffeecv.split_report` shows each split's
# photos. val/test floor at 1 photo. See split_photos_by_class.
train_photo_frac: 0.70
val_photo_frac: 0.15
test_photo_frac: 0.15

# Scale augmentation (Phase 11): patch side as a log-uniform fraction of the
# photo's short side, replacing the fixed patch_crop_size. 0/0 = off.
patch_scale_frac_min: 0.0
patch_scale_frac_max: 0.0

# Bean-unit patch sizing (Phase 12): side = B * measured bean pitch, B log-uniform.
# B = sqrt(beans in the patch), so 6-9 across = ~36-81 beans per patch.
# Measured per photo by the same estimator used at inference. 0/0 = off.
patch_beans_min: 4.0
patch_beans_max: 7.0

# Bean-pitch estimator geometry (coffeecv/bean_scale.py). Promoted from module
# constants to config on 2026-09-03: they were previously unrecorded in any run,
# so config_for_checkpoint could not restore them and changing one silently
# re-sized patches for every checkpoint ever trained, the deployed one included.
# The values below are exactly the old constants, so this changed no behaviour.
#
# bean_k_lo is the FFT search band's low edge. Contrary to the hypothesis that
# the argmax was being clipped there, raising it *improves* reconstruction
# accuracy on all 8 rigs (MAPE 20.2% -> 14.4%, corr 0.835 -> 0.899 over 60
# hand/VLM-counted crops) -- the floor suppresses 1/f spectral drag rather than
# clipping bean signal. bean_calibration_k is fitted to the band and must move
# with it: k_lo=5 refits to 1.334. NOT adopted -- offline reconstruction
# accuracy is not classification accuracy. The cross-camera sweep that was to
# decide it ("C1-ship") went with the fold protocol (ticket ML-1, D7): if still
# wanted, it is a paired multi-seed screen on the pooled split like any other
# change. See analysis/bean_scale/README.md.
bean_k_lo: 4
bean_k_hi: 80
bean_analysis_frac: 0.40
bean_calibration_k: 1.18

rotation_jitter_degrees: 0.0 # +/- jitter around each right angle, at patch sampling (max ~6 here)

# The fine-tuned ResNet18's model, augmentation (ColorJitter, zoom, erasing, illumination, mixup, MixStyle) and
# SGD-loop parameters were removed on 2026-10-20 with its trainer. The frozen head's augmentation is
# head_augment below (ADR 0025), shared with the segmenter's fine-tune through `augment` (ADR 0027).

# Ticket ML-2 (D21): split seed for the segmenter's photo lists (seg_lists.py ->
# labels/ml2/photo_lists.yaml). Not a head seed; changing it after the lists are
# committed is refused, since the lists are append-only (D20).
seg_split_seed: 239

# Ticket ML-2 (D5, owner 2026-10-01): the segmenter's fixed prompt (one whole-image
# box) and which decoder output it keeps (multi3, the widest). See
# analysis/ml2_p0/README.md for why: no fixed prompt finds the pile on tray photos.
seg_prompt: box
seg_mask_select: multi3

# Ticket ML-2 (D18, owner 2026-10-01): tiny-mask threshold. A mask below this
# fraction of the photo counts as empty and the whole photo is used. Half the
# smallest owner-accepted base mask (0.1657). The plan's rule (half the smallest
# judge-accepted pretrained mask) gives 0.45, since only frame-filling masks
# pass, and would send every correct tray mask to the fallback.
# Ticket ML-5 P10 (D21, owner 2026-10-09): re-derived on the segmenter dataset's test split as
# half the smallest owner-accepted XL0-v2 test-positive mask (0.0804); 2 test positives fall
# under it against 4 under 0.083, and 35/41 test negatives stay empty or tiny (36 under 0.083).
# analysis/ml5_p10_paired/.
# Ticket ML-6 P7 (D7 (a), owner 2026-10-13): re-derived by the same rule from the owner-accepted
# XL0-v3 test-positive masks (smallest 0.1290), 0.040223 before; the same 2 test positives fall
# under either value, and 141/153 test negatives are empty or tiny under it (140 under 0.040223).
# analysis/ml6_p7_paired/.
seg_min_area_frac: 0.064511

# Ticket ML-2 P3 (plan §6): where the bean region comes from. segment = the segmenter
# below, at both ends (segcrop stage -> data/segcropped, live segmentation in
# infer.py). tray_heuristic = infer.crop_to_bean_region, which the retired tray-heuristic
# models (allrigs_cam_s123 and older) served with; their data/cropped pools were retired
# in ticket ML-3 P2b, so it rests at segment, matching train_capture_dirs above.
crop_method: segment
# The segmenter. Ticket ML-6 P7 (D23, owner 2026-10-13): XL0-v3, pretrained XL0 + the decoder
# fine-tuned on the owner's pass-3 labels with on-the-fly augmentation (models/seg/xl0_v3.json); the
# classifier is re-cropped with it in ML-6 P8 (D8 (a)). Before: ML-5 P10 (D20, owner 2026-10-09)
# XL0-v2 (models/seg/xl0_v2.json), and until then (ML-2 P5, owner 2026-10-02) pretrained L0 +
# ft_s123, which the shipped classifier was cropped with.
seg_weights: efficientvit_sam/efficientvit_sam_xl0.pt
seg_weights_sha256: 9bc2f87bd23d6e6d1f7b5beff910f98835c7c333fac73e695bac0bec685968f8
seg_decoder: models/seg/xl0_v3.pt
seg_decoder_sha256: 4b21ed7beeb20b12eabe8b8afc078d45011ed1d6fa71855638b1c6947da9ae22
# D4: keep >= 95% of the bean region (cut 1.25% of its pixels per side).
seg_keep_frac: 0.95
# D17: reject a patch box under 80% bean region; after 20 x n candidates, top up
# with the best rejected boxes.
patch_min_bean_share: 0.80
patch_max_attempts_factor: 20

# ADR 0027 (the owner, 2026-10-20): augmentation both fits share, the segmenter's fine-tune (seg_ft.augment) and
# the classifier's head fit (head_augment). A pipeline names a group as {use: <group>}; RunConfig.from_params_yaml
# expands it in place (coffeecv/augment.py expand), so runs and cards record the transforms, not the name. Shared:
# what means the same at the segmenter's 1024 px photo and the classifier's 224 px patch -- colour, JPEG quality
# and noise relative to the range. Not shared: geometry (the segmenter's moves its label) and blur, whose radius is
# in pixels. A fit may add its own transforms on top (the segmenter: a hue shift and gamma; colour carries origin,
# so the classifier's hue stays 0), never weaken a group. Each group is the classifier's pipeline of exp270-272,
# so the classifier's recipe is unchanged; the segmenter's colour moved from RandomBrightnessContrast (0.2, 0.2,
# p 0.5, XL0-v3's) to these at its next fine-tune. A DVC stage that trains with a pipeline lists `augment` in its
# params beside the block, or a changed group does not invalidate it.
augment:
  colour:
    - {transform: ColorJitter, p: 0.8, args: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.0}}
    - {transform: PlanckianJitter, p: 0.3}
  compression:
    - {transform: ImageCompression, p: 0.3, args: {quality_range: [60, 95]}}
  noise:
    - {transform: GaussNoise, p: 0.2, args: {std_range: [0.01, 0.04]}}

# Ticket ML-2 P5 (D7 (a), plan §8): decoder-only fine-tuning of the segmenter, read only by
# coffeecv/seg_finetune.py. The image and prompt encoders stay frozen; the prompt (seg_prompt) and the
# trained output (seg_mask_select) are the serving ones. Loss: focal_weight x focal(gamma, alpha) +
# dice_weight x soft dice + iou_weight x MSE on the IoU head (SAM's weighting). augment: ticket ML-6 D12,
# D16 (docs/adr/0018): albumentations transforms built by name, each {transform, p, args}, applied to each
# training sample as it is drawn and never stored; validation is not augmented. Spatial: the flips (which
# cover ML-5's 4 cached views) and a mild Affine whose exposed border is black in the photo and 255
# (ignored) in the label. Pixel: the shared colour group (augment above, ADR 0027), then its own small hue shift
# (green and roasted beans differ by colour), saturation and value, and gamma; the shared compression group;
# motion blur or defocus; the shared noise group. The blur strengths are mild picks, the library's defaults
# being harsh (Defocus radius 3-10 px). XL0-v3 trained with RandomBrightnessContrast (0.2, 0.2, p 0.5) where the
# colour group now stands (its card, models/seg/xl0_v3.json). XL0-v1 and v2 had views [id, hflip, vflip, rot180] instead. neg_share: share of each batch drawn from the training
# negatives (D10/D11); the validation negatives choose the checkpoint (ML-5 D8; ML-2 held out a random
# neg_select_frac of 0.2 of its negative groups instead). point_share: ticket ML-5 D15, the share of batches
# that add 1 to max_points points from the error region of the box-only prediction to the box (0.5: box or
# points at random, as EfficientViT-SAM trains). select_min_area_frac: the tiny-mask rule of checkpoint
# selection on the validation negatives, the value XL0-v1 and v2 were selected with (ML-2 D18's 0.083); the
# fine-tune's own since ML-5 P11, so that moving serving's seg_min_area_frac retrains nothing. weights: the
# pretrained base under models_pretrained/; its variant sets the training frame and the loss's frame (ticket ML-5 P4: 512 for L0, 1024 for XL0). It is the fine-tune's own, not
# seg_weights, which names the classifier's segmenter and moves only when the classifier is re-cropped.
# The one place the fine-tune's base is written: seg_predict's "pretrained" is it, and each decoder runs over
# the base its card (models/seg/<name>.json) records (segment_beans.decoder_base).
seg_ft:
  weights: efficientvit_sam/efficientvit_sam_xl0.pt
  augment:
    - {transform: HorizontalFlip, p: 0.5}
    - {transform: VerticalFlip, p: 0.5}
    - {transform: Affine, p: 0.5, args: {scale: [0.9, 1.1], translate_percent: [-0.05, 0.05], rotate: [-15, 15],
                                         border_mode: 0, fill: 0, fill_mask: 255}}
    - {use: colour}
    - {transform: HueSaturationValue, p: 0.3, args: {hue_shift_limit: 5, sat_shift_limit: 15, val_shift_limit: 10}}
    - {transform: RandomGamma, p: 0.3, args: {gamma_limit: [80, 120]}}
    - {use: compression}
    - {transform: OneOf, p: 0.2, args: {transforms: [{transform: MotionBlur, p: 1.0, args: {blur_limit: [3, 7]}},
                                                     {transform: Defocus, p: 1.0, args: {radius: [1, 3]}}]}}
    - {use: noise}
  epochs: 40
  patience: 8
  batch_size: 8
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  focal_weight: 20.0
  dice_weight: 1.0
  iou_weight: 1.0
  focal_gamma: 2.0
  focal_alpha: 0.25
  neg_share: 0.5
  point_share: 0.5
  max_points: 3
  select_min_area_frac: 0.083

# Ticket ML-8 D4 (docs/adr/0025): the frozen DINOv3 head is fitted on `views` augmented views of every training
# patch beside the patch itself, drawn per run (seeded by the run's seed, the patch and the view), embedded and held
# in memory as embeddings only, never stored; val and test are not augmented. Read only by
# coffeecv/fit_frozen_head.py; every pipeline is built by coffeecv/augment.py's strict builder (albumentations
# 2.0.8, pinned: an argument it does not know fails the run). `patch` acts on the stored patch (patch_store_size,
# 448 px): geometry, occlusion and colour. `input` acts on the patch after the resize to patch_resize (224 px), so
# its strengths are in the model's input pixels: the camera pipeline (at 448 the resize would undo Downscale and
# halve blur and noise). Plan P6: SquareSymmetry (beans have no "up"); Affine scale only, its border reflected
# (border_mode 4 = cv2.BORDER_REFLECT_101; the default fills black); CoarseDropout filled with the ImageNet mean;
# ColorJitter with hue 0 (colour carries origin and roast) and PlanckianJitter (white balance), the shared colour
# group (augment above, ADR 0027); then the shared compression group, one blur, the shared noise group and Downscale with area down and linear up (interpolation 3 = cv2.INTER_AREA, 1 = INTER_LINEAR).
# Left out: ToGray, ChannelDropout, hue shifts, rotation by any angle, RandomResizedCrop.
head_augment:
  views: 8
  patch:
    - {transform: SquareSymmetry, p: 1.0}
    - {transform: Affine, p: 0.5, args: {scale: [0.9, 1.1], border_mode: 4}}
    - {transform: CoarseDropout, p: 0.5, args: {num_holes_range: [1, 8], hole_height_range: [0.05, 0.15],
                                                hole_width_range: [0.05, 0.15], fill: [124, 116, 104]}}
    - {use: colour}
  input:
    - {use: compression}
    - {transform: OneOf, p: 0.2, args: {transforms: [{transform: GaussianBlur, p: 1.0, args: {blur_limit: [3, 5]}},
                                                     {transform: MotionBlur, p: 1.0}, {transform: Defocus, p: 1.0}]}}
    - {use: noise}
    - {transform: Downscale, p: 0.2, args: {scale_range: [0.5, 0.9],
                                            interpolation_pair: {downscale: 3, upscale: 1}}}

# Ticket ML-5 P5 (D11-D13, D16): the segmenter dataset (coffeecv/seg_dataset.py ->
# labels/ml5/seg_dataset.yaml). seed draws the pool photos (D12) and orders the split; split is
# the train/validation/test share within each source, and within each batch for negatives
# (D13, D16; within each (batch, tag) until ticket ML-8 D9 dropped the tags). The file records both, and a rebuild refuses other values: it is append-only (D11).
# 511 is none of the head seeds (42/123/7) and not ML-2's seg_split_seed (239).
seg_dataset:
  seed: 511
  split:
    train: 0.60
    validation: 0.15
    test: 0.25

# Ticket ML-5 P6/P10 (D22): in the blind paired review of XL0-v1 and XL0-v2 test masks, which model's mask is on
# the left is drawn per photo from this seed (coffeecv/seg_review.py paired). 2210 is no other seed here.
seg_paired_seed: 2210
