# Hyperparameters for coffeecv training. Read by coffeecv/config.py and tracked
# by DVC (`dvc exp run`) so runs can be compared via `dvc exp show`.

seed: 42

dataset_dir: dataset/2026-08-07__box_pictures_all_classes
classes_file: dataset/classes.txt

# Patch geometry
patch_crop_size: 700
patch_resize: 224
safety_margin: 0.97
train_patches_per_class: 150
val_patches_per_class: 40
test_patches_per_class: 40

# Photo-level split sizes (multi-photo box-rig dataset; must sum to 20 photos/class)
train_photos_per_class: 14
val_photos_per_class: 3
test_photos_per_class: 3

# Model
model_name: resnet18
freeze_mode: none  # full | last_block | none
dropout: 0.2
label_smoothing: 0.0
color_jitter_strength: 0.2

# Training
batch_size: 32
epochs: 50
early_stop_patience: 8  # stop if val_macro_f1 hasn't improved in this many epochs
optimizer: adamw  # adamw | sgd
lr: 0.001
backbone_lr: 0.00001  # used only when freeze_mode != full
weight_decay: 0.0001
scheduler: cosine
