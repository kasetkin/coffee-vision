# Hyperparameters for coffeecv training. Read by coffeecv/config.py and tracked
# by DVC (`dvc exp run`) so runs can be compared via `dvc exp show`.

seed: 42

dataset_dir: dataset/2026-07-24__first_pictures
classes_file: dataset/classes.txt

# Patch geometry
patch_crop_size: 512
patch_resize: 224
safety_margin: 0.97
train_patches_per_class: 150
val_patches_per_class: 40
test_patches_per_class: 40

# Model
model_name: resnet18  # isolated test: was mobilenet_v3_small
freeze_backbone: true
dropout: 0.2
label_smoothing: 0.0

# Training
batch_size: 32
epochs: 20
optimizer: adamw
lr: 0.0003    # isolated test: was 0.001 - resnet18-frozen's val_macro_f1 oscillated 0.60-0.65 all 20 epochs instead of settling
weight_decay: 0.0001
scheduler: cosine
