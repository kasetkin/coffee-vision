# Hyperparameters for coffeecv training. Read by coffeecv/config.py and tracked
# by DVC (`dvc exp run`) so runs can be compared via `dvc exp show`.

seed: 7

# Training reads the cropped tree produced by the `crop` stage, not the raw
# session. Crop *method* settings live per-session in
# dataset/<session>.crop.yaml -- they describe a rig, not the model.
#
# Leave-one-rig-out (Phase 11). train_rigs are split train/val/test at the photo
# level; heldout_rig contributes every photo as a cross-rig test set and is never
# trained on. Rotate heldout_rig across the three rigs to get three independent
# transfer numbers -- a single held-out rig is n=1 and cannot tell a real result
# from the luck of which rig was held out.
train_rigs:
  - data/cropped/2026-08-07__box_pictures_all_classes
  - data/cropped/2026-08-09__pixel_cam
  - data/cropped/2026-08-09__sony_cam
heldout_rig: ""
classes_file: dataset/classes.txt

# Patch geometry
patch_crop_size: 900
patch_resize: 224
patch_store_size: 448  # 0 = keep full patch_crop_size (single-rig legacy behaviour)
safety_margin: 0.97
train_patches_per_class: 150   # per class *per training rig*
val_patches_per_class: 40
test_patches_per_class: 40
xrig_patches_per_class: 120    # held-out rig: bigger budget, it is the headline metric

# Photo-level split sizes (multi-photo box-rig dataset; must sum to 20 photos/class)
train_photos_per_class: 14
val_photos_per_class: 3
test_photos_per_class: 3

# Model
model_name: resnet18
freeze_mode: last_block  # full | last_block | none
dropout: 0.2
label_smoothing: 0.0
color_jitter_strength: 0.2
# Phase 13: overrides brightness only (contrast/saturation/hue keep
# color_jitter_strength above). 0.0 = no-op, falls back to color_jitter_strength.
# Rigs differ 1.48-1.59x in grey mean; 0.2 (0.8-1.2x) cannot reach that.
brightness_jitter_strength: 0.0

# Augmentation (Phase 8). Every value here is a no-op at the setting shown;
# the Phase 7 baseline is this whole block off.
# Scale augmentation (Phase 11): patch side as a log-uniform fraction of the
# photo's short side, replacing the fixed patch_crop_size. 0/0 = off.
patch_scale_frac_min: 0.0
patch_scale_frac_max: 0.0

# Bean-unit patch sizing (Phase 12): side = B * measured bean pitch, B log-uniform.
# B = sqrt(beans in the patch), so 6-9 across = ~36-81 beans per patch.
# Measured per photo by the same estimator used at inference. 0/0 = off.
patch_beans_min: 4.0
patch_beans_max: 7.0

rotation_jitter_degrees: 0.0 # +/- jitter around each right angle, at patch sampling (max ~6 here)
zoom_scale_min: 1.0          # RandomResizedCrop min area fraction (1.0 = plain resize)
random_erasing_p: 0.5        # per-patch probability of erasing a rectangle
illum_gradient_strength: 0.0 # +/- fraction of a corner-to-corner luminance ramp
mixup_alpha: 0.0             # Beta(a, a) mixing strength (train loop, not a transform)

# MixStyle (domain-agnostic v1, Phase 16): mixes each training batch's per-sample
# channel mean/std with a randomly permuted copy of the batch, inside the model's
# forward pass. mixstyle_p is the per-batch probability; 0.0 would be the no-op.
# ADOPTED at 0.5 (the paper's own default) -- 9/9 fold x seed pairs sign-consistent,
# mean +0.1400 cross-rig, the cleanest and 2nd-largest confirmed lever on this
# project after bean-unit sizing. See EXPERIMENTS_LOG.md Phase 16 / exp115-123.
mixstyle_p: 0.5
mixstyle_alpha: 0.1          # Beta(a, a) shape for the mixing coefficient

# Training
batch_size: 32
epochs: 80
early_stop_patience: 8  # stop if val_macro_f1 hasn't improved in this many epochs
optimizer: adamw  # adamw | sgd
lr: 0.001
backbone_lr: 0.00001  # used only when freeze_mode != full
weight_decay: 0.0001
