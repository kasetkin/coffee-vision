# Hyperparameters for coffeecv training. Read by coffeecv/config.py and tracked
# by DVC (`dvc exp run`) so runs can be compared via `dvc exp show`.

seed: 123  # Phase 1 noise calibration: was 42

dataset_dir: dataset/2026-07-24__first_pictures
classes_file: dataset/classes.txt

# Patch geometry
patch_crop_size: 512
patch_resize: 224
safety_margin: 0.97
train_patches_per_class: 150
val_patches_per_class: 40
test_patches_per_class: 40

# Model
model_name: resnet18  # best so far: switched from mobilenet_v3_small
freeze_mode: full  # full | last_block | none
dropout: 0.2
label_smoothing: 0.0
color_jitter_strength: 0.2

# Training
batch_size: 32
epochs: 20
optimizer: adamw  # adamw | sgd
lr: 0.001
backbone_lr: 0.00001  # used only when freeze_mode != full
weight_decay: 0.0001
scheduler: cosine
