# Hyperparameters for coffeecv training. Read by coffeecv/config.py and tracked
# by DVC (`dvc exp run`) so runs can be compared via `dvc exp show`.

seed: 17

# Training reads the cropped tree produced by the `crop` stage, not the raw
# session. Crop *method* settings live per-session in
# dataset/<session>.crop.yaml -- they describe a rig, not the model.
#
# Leave-one-rig-out (Phase 11). train_rigs are split train/val/test at the photo
# level; heldout_rig contributes every photo as a cross-rig test set and is never
# trained on, so a fold measures transfer to a camera it has never seen.
#
# BOTH sweep drivers rewrite this block before every run -- run_folds.py sets one
# fold at a time, run_all_rigs.py sets the whole list with heldout_rig empty --
# so what is written here is only what a bare `dvc repro train` reproduces, never
# what a sweep uses. It rests at the all-rigs shipping config (the shape exp171,
# the currently deployed model, was trained in), because that is the one a plain
# repro should reproduce.
#
# Do not hand-edit this to run a fold. `python -m coffeecv.run_folds` owns the
# rotation and now distinguishes rig-transfer folds from class-transfer ones:
# holding out an 08-30 session yields a ONE-CLASS macro average, so those three
# are excluded from the default sweep and need --include-class-transfer. See
# run_folds.py's RIGS. As of 2026-09-03 a rig is a CAMERA MODEL, not a capture
# session -- four rigs (Pixel, Sony, OnePlus, iPhone) built by the merge_cam_*
# stages, rather than nine sessions. See run_folds.RIGS for why, and for the
# cost: this pools framing distance inside each camera.
train_rigs:
  - data/cropped/cam_pixel
  - data/cropped/cam_sony
  - data/cropped/cam_oneplus
  - data/cropped/cam_iphone
heldout_rig: ""
classes_file: dataset/classes.txt

# Patch geometry
patch_crop_size: 900
patch_resize: 224
patch_store_size: 448  # 0 = keep full patch_crop_size (single-rig legacy behaviour)
safety_margin: 0.97
train_patches_per_class: 150   # per class *per training rig*
val_patches_per_class: 40
test_patches_per_class: 40
xrig_patches_per_class: 120    # held-out rig: bigger budget, it is the headline metric

# Photo-level split, as fractions of however many photos a rig+class actually
# has (not a fixed count -- box/pixel/sony have 20/class, oneplus has 10/class,
# iPhone varies 10-20 *per class*). 0.70/0.15/0.15 reproduces the original
# fixed 14/3/3 split exactly for any 20-photo class. See split_photos_by_class.
train_photo_frac: 0.70
val_photo_frac: 0.15
test_photo_frac: 0.15

# Model
model_name: resnet18
freeze_mode: none  # full | last_block | none -- matches what Phase 16's MixStyle screen (exp115-123) actually validated; run_folds.py's own --freeze-mode CLI default is also "none" independent of this resting value
dropout: 0.2
label_smoothing: 0.0
color_jitter_strength: 0.2
# Phase 13: overrides brightness only (contrast/saturation/hue keep
# color_jitter_strength above). 0.0 = no-op, falls back to color_jitter_strength.
# Rigs differ 1.48-1.59x in grey mean; 0.2 (0.8-1.2x) cannot reach that.
brightness_jitter_strength: 0.0

# Augmentation (Phase 8). Every value here is a no-op at the setting shown;
# the Phase 7 baseline is this whole block off.
# Scale augmentation (Phase 11): patch side as a log-uniform fraction of the
# photo's short side, replacing the fixed patch_crop_size. 0/0 = off.
patch_scale_frac_min: 0.0
patch_scale_frac_max: 0.0

# Bean-unit patch sizing (Phase 12): side = B * measured bean pitch, B log-uniform.
# B = sqrt(beans in the patch), so 6-9 across = ~36-81 beans per patch.
# Measured per photo by the same estimator used at inference. 0/0 = off.
patch_beans_min: 4.0
patch_beans_max: 7.0

# Bean-pitch estimator geometry (coffeecv/bean_scale.py). Promoted from module
# constants to config on 2026-09-03: they were previously unrecorded in any run,
# so config_for_checkpoint could not restore them and changing one silently
# re-sized patches for every checkpoint ever trained, the deployed one included.
# The values below are exactly the old constants, so this changed no behaviour.
#
# bean_k_lo is the FFT search band's low edge. Contrary to the hypothesis that
# the argmax was being clipped there, raising it *improves* reconstruction
# accuracy on all 8 rigs (MAPE 20.2% -> 14.4%, corr 0.835 -> 0.899 over 60
# hand/VLM-counted crops) -- the floor suppresses 1/f spectral drag rather than
# clipping bean signal. bean_calibration_k is fitted to the band and must move
# with it: k_lo=5 refits to 1.334. NOT adopted -- offline reconstruction
# accuracy is not classification accuracy, so this needs a run_folds cross-rig
# sweep first ("C1-ship"). See analysis/bean_scale/README.md.
bean_k_lo: 4
bean_k_hi: 80
bean_analysis_frac: 0.40
bean_calibration_k: 1.18

rotation_jitter_degrees: 0.0 # +/- jitter around each right angle, at patch sampling (max ~6 here)
zoom_scale_min: 1.0          # RandomResizedCrop min area fraction (1.0 = plain resize)
random_erasing_p: 0.5        # per-patch probability of erasing a rectangle
illum_gradient_strength: 0.0 # +/- fraction of a corner-to-corner luminance ramp
mixup_alpha: 0.0             # Beta(a, a) mixing strength (train loop, not a transform)

# MixStyle (domain-agnostic v1, Phase 16): mixes each training batch's per-sample
# channel mean/std with a randomly permuted copy of the batch, inside the model's
# forward pass. mixstyle_p is the per-batch probability; 0.0 would be the no-op.
# ADOPTED at 0.5 (the paper's own default) -- 9/9 fold x seed pairs sign-consistent,
# mean +0.1400 cross-rig, the cleanest and 2nd-largest confirmed lever on this
# project after bean-unit sizing. See EXPERIMENTS_LOG.md Phase 16 / exp115-123.
mixstyle_p: 0.5
mixstyle_alpha: 0.1          # Beta(a, a) shape for the mixing coefficient
# v2 (screening, not yet adopted): restricts the mixing partner to a different
# rig instead of any random batch sample. agnostic | cross_rig.
mixstyle_mode: agnostic

# Training
batch_size: 32
epochs: 100
early_stop_patience: 20  # stop if val_macro_f1 hasn't improved in this many epochs
# CosineAnnealingLR floor (0.0 = PyTorch default, decays to exactly zero). Set to
# 1e-5 so the LR trickles rather than flatlining in a long run's last ~15-20
# epochs. ADOPTED on a 1-seed x 3-fold screen (seed 42): 3/3 positive cross-rig
# macro-F1, but only box/pixel showed a real gain (+0.0264/+0.0234); sony was
# flat (+0.0027) -- promising, not the full 3-seed confirmation this project
# usually requires (see feedback-experiment-evidence-standard), adopted anyway
# on a cost/benefit call (full confirmation estimated ~50h more compute).
# exp151-156; see project-eta-min-screen memory for the full writeup.
eta_min: 1.0e-05
optimizer: adamw  # adamw | sgd
lr: 0.001
backbone_lr: 0.00001  # used only when freeze_mode != full
weight_decay: 0.0001
