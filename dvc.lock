    cmd: python -m coffeecv.seg_finetune train --labels pass4 --seed 123 --name 
      xl0_v4 --threads 8
    deps:
    - path: coffeecv/augment.py
      hash: md5
      md5: 6a71865bf74fe4be33b956f443f35169
      size: 4440
    - path: coffeecv/sam_loader.py
      hash: md5
      md5: e8615df752d8acadfae306946fdc6d21
      size: 3296
    - path: coffeecv/seg_finetune.py
