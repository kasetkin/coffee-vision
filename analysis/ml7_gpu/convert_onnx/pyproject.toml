# ML-7 P1: the ONNX export and ONNX Runtime's CPU check, apart from the training lock (ADR 0007; plan P1).
# The training lock has no onnx (ML-2 D23, third_party/efficientvit/PATCHES.md row 3), so the exporter lives
# here, at the training lock's torch and timm: the same torch the release route would export with (ticket D6).
#     uv lock --project analysis/ml7_gpu/convert_onnx
#     UV_PROJECT_ENVIRONMENT=analysis/ml7_gpu/convert_onnx/.venv uv sync --locked --project analysis/ml7_gpu/convert_onnx
# Set UV_PROJECT_ENVIRONMENT every time: the devcontainer points it at the training venv, so a plain
# `uv sync --project` here would rewrite the training environment to this lock (it did once, in P1).
[project]
name = "ml7-convert-onnx"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.14.0",
  "torchvision",
  "timm==1.0.30",
  "numpy",
  "pyyaml",
  "pillow",
  # coffeecv.infer, which builds the models as serving does, imports the photo decoders: webapp/pyproject.toml's
  "pillow-heif",
  "pillow-avif-plugin==1.6.0",
  "pillow-jxl-plugin==1.3.8",
  "rawpy",
  "opencv-python-headless",
  "segment-anything==1.0",
  "onnx",
  "onnxscript",
  "onnxruntime",
  # float16 conversion with op and node block lists (plan P1, ticket D12)
  "onnxconverter-common",
]

[tool.uv]
package = false
required-version = "==0.12.19"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# As in the training pyproject: timm without huggingface_hub/safetensors.
[[tool.uv.dependency-metadata]]
name = "timm"
version = "1.0.30"
requires-dist = ["torch", "torchvision", "pyyaml"]
