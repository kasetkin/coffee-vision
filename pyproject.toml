# The training environment: coffeecv, coffeecv_dino, scripts/, analysis/, tests/, and `dvc repro`.
# Locked in uv.lock; install with `uv sync --locked`. The devcontainer does this on create (into
# /home/vscode/.venv, see .devcontainer/devcontainer.json).
#
# Not the web service's environment: that is webapp/pyproject.toml with its own lock, deliberately
# separate (OPS-1). The two share the image decoders (pillow + the heif/avif/jxl plugins); keep those
# at the webapp's versions or check the difference, since a decoder change changes the pixels.
#
# Re-lock after any edit here (with the uv version pinned below):
#     uv lock
[project]
name = "coffee-cv-train"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  # From the CPU wheel index (tool.uv.sources below): the default PyPI torch pulls in the CUDA stack.
  "torch==2.14.0",
  "torchvision",
  # DINOv3 is built through timm (docs/dinov3_integration_plan.md §2). Pinned exactly: a timm
  # upgrade is an architecture change and must re-pass tests/test_dino_backbone.py.
  "timm==1.0.30",
  "numpy",
  "scipy",
  "pyyaml",
  "pillow",
  "pillow-heif",
  # coffeecv.dataset imports both to register AVIF / JPEG XL with Pillow. Same versions as
  # webapp/pyproject.toml, so training and serving decode these photos identically.
  "pillow-avif-plugin==1.6.0",
  "pillow-jxl-plugin==1.3.8",
  "rawpy",
  "opencv-python-headless",
  "scikit-learn",
  "matplotlib",
  "albumentations",
  "tensorboard",
  "tqdm",
  # [ssh]: the DVC remote is ssh:// (.dvc/config).
  "dvc[ssh]",
]

[dependency-groups]
# tests/test_release_manifest.py imports webapp.app. Synced by default (uv's `dev` group).
dev = ["flask"]

[tool.uv]
package = false
required-version = "==0.12.19"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# timm without huggingface_hub/safetensors, as on the VM and in webapp/pyproject.toml: they exist only to
# download pretrained weights, and coffeecv_dino loads its own sha256-checked files from models_pretrained/.
[[tool.uv.dependency-metadata]]
name = "timm"
version = "1.0.30"
requires-dist = ["torch", "torchvision", "pyyaml"]
