# How this capture session's raw photos are cropped to bean-tray images.
#
# Deliberately NOT in params.yaml: these settings describe one *rig*, not the
# model. `trim_frac` assumes a fixed tripod at a fixed distance, where the tray
# rim is a constant fraction of the tray's bounding box. A session shot at a
# different angle, or of a differently-shaped tray, does not just need a
# different number here -- it may need a different `method` entirely. Keeping
# this per-session means adding such a session changes nothing global.
#
# Consumed by coffeecv/crop_session.py, declared as a *dep* of the `crop` stage
# in dvc.yaml (not a param), so edits invalidate the stage and the file's hash is
# recorded in dvc.lock for provenance without entering the hyperparameter surface.

method: fixed_trim  # fixed_trim | adaptive

# Per-side trim, as a fraction of the stage-1 rough tray box. Asymmetric because
# the rim measurably is: over all 180 photos of this session, rim depth reaches
# 0.056 of the rough box on the left and 0.063 on the right, but only ~0.012 top
# and ~0.011 bottom (measured with an illumination-robust local-texture scan, not
# eyeballed). A symmetric trim large enough for the right edge therefore discards
# ~20% of the height for nothing.
#
# Each value is the measured worst case + 0.020 of margin. A +0.010 margin was
# tried first and measured dirtier than the old symmetric 0.10 baseline, so it
# was rejected; +0.020 measures as clean as that baseline while keeping ~5% more
# width. That is deliberately
# tighter than the old symmetric 0.10, so it is QA'd visually at full resolution
# after every change -- a 0.05 symmetric trim was tried first and rejected
# exactly there, with the rim plainly inside the crop.
trim:
  left: 0.076    # measured max rim 0.056 + 0.020 margin
  right: 0.083   # measured max rim 0.063 + 0.020 margin
  top: 0.032     # measured max rim 0.012 + 0.020 margin
  bottom: 0.031  # measured max rim 0.011 + 0.020 margin

notes: >
  Fixed tripod rig, 180 photos over ~2h on 2026-08-07. The adaptive path
  (locate_bean_region's per-image Otsu trim) is unstable here: directional
  lighting drift over the shoot made it split the bean texture's own saturation
  variance rather than the bean/rim boundary, once collapsing a valid box to
  178x1065 despite zero rim contamination. The fixed trim avoids that failure
  mode entirely, at the cost of needing re-tuning if the rig's rim width changes.
