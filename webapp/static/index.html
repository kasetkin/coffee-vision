<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Bean Origin Classifier</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --fg: #2a1e14;
    --muted: #6b5c4d;
    --accent: #6f4527;
    --accent-fg: #fff;
    --card: #fff;
    --border: #e2d8cb;
    --warn-bg: #fff4e0;
    --warn-fg: #6b4c00;
    --refuse-bg: #fdecec;
    --refuse-fg: #7a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1611;
      --fg: #f1e9df;
      --muted: #b8a996;
      --accent: #c68a4e;
      --accent-fg: #1b1611;
      --card: #26201a;
      --border: #3a3025;
      --warn-bg: #3a2e12;
      --warn-fg: #ffd98a;
      --refuse-bg: #3a1c1c;
      --refuse-fg: #ff9d9d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 32rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; text-align: center; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  button, .file-btn {
    flex: 1;
    min-width: 8rem;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-fg);
    text-align: center;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=file] { display: none; }
  .formats-hint {
    margin-top: 0.6rem;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  #preview {
    display: none;
    width: 100%;
    max-height: 20rem;
    object-fit: contain;
    border-radius: 0.5rem;
    margin-top: 1rem;
  }
  #status { margin-top: 0.75rem; color: var(--muted); font-size: 0.95rem; text-align: center; }
  .result-box {
    padding: 0.9rem 1rem;
    border-radius: 0.5rem;
    margin-top: 0.5rem;
    line-height: 1.4;
  }
  .result-box.refused { background: var(--refuse-bg); color: var(--refuse-fg); }
  .result-box.warned { background: var(--warn-bg); color: var(--warn-fg); margin-bottom: 0.75rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  td { padding: 0.4rem 0.2rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  td.label { color: var(--fg); }
  td.score { text-align: right; color: var(--muted); white-space: nowrap; }
  tr:first-child td { font-weight: 700; color: var(--fg); }
  .bar-track { background: var(--border); border-radius: 3px; height: 6px; margin-top: 4px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
</style>
</head>
<body>
<main>
  <h1>Coffee Bean Origin Classifier</h1>

  <div class="card">
    <div class="controls">
      <label class="file-btn" for="photo-input">Choose Photo</label>
      <button id="classify-btn" disabled>Classify</button>
    </div>
    <div class="formats-hint">JPG &middot; PNG &middot; WEBP &middot; HEIC/HEIF &middot; AVIF &middot; JPEG XL</div>
    <input id="photo-input" type="file"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,image/jxl,.jpg,.jpeg,.png,.webp,.heic,.heif,.avif,.jxl"
           capture="environment">
    <img id="preview" alt="Selected photo preview">
    <div id="status"></div>
  </div>

  <div id="result"></div>
</main>

<script>
const fileInput = document.getElementById('photo-input');
const preview = document.getElementById('preview');
const classifyBtn = document.getElementById('classify-btn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

let previewUrl = null;

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  resultEl.innerHTML = '';
  preview.style.display = 'none';
  classifyBtn.disabled = true;
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
  if (!file) {
    statusEl.textContent = '';
    return;
  }

  // Always converted server-side to JPEG (POST /preview), not shown directly
  // from the file the browser was given -- some formats this app accepts
  // (HEIC/HEIF especially) aren't natively decodable by most browsers' <img>,
  // only Safari can preview those directly. The server already has to decode
  // every format to classify it, so reusing that here guarantees the preview
  // always renders, in any browser, and shows exactly what the model sees.
  statusEl.textContent = 'Loading preview...';
  try {
    const formData = new FormData();
    formData.append('photo', file);
    const res = await fetch('/preview', { method: 'POST', body: formData });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      statusEl.textContent = '';
      renderRefused(data.error || "Could not read this photo.");
      return;
    }
    const blob = await res.blob();
    previewUrl = URL.createObjectURL(blob);
    preview.src = previewUrl;
    preview.style.display = 'block';
    statusEl.textContent = '';
    classifyBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = '';
    renderRefused('Could not reach the server -- check your connection and try again.');
  }
});

classifyBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  classifyBtn.disabled = true;
  fileInput.disabled = true;
  resultEl.innerHTML = '';
  statusEl.textContent = 'Analyzing... (this takes several seconds)';

  const formData = new FormData();
  formData.append('photo', file);

  try {
    const res = await fetch('/classify', { method: 'POST', body: formData });
    const data = await res.json();
    statusEl.textContent = '';
    if (!res.ok) {
      renderRefused(data.error || 'Something went wrong -- try a different photo.');
    } else {
      render(data);
    }
  } catch (err) {
    statusEl.textContent = '';
    renderRefused('Could not reach the server -- check your connection and try again.');
  } finally {
    classifyBtn.disabled = false;
    fileInput.disabled = false;
  }
});

function renderRefused(message) {
  resultEl.innerHTML = `<div class="result-box refused">${escapeHtml(message)}</div>`;
}

function render(data) {
  if (data.verdict === 'refused_scale' || data.verdict === 'refused_ood' || data.verdict === 'refused_unreadable') {
    renderRefused(data.message);
    return;
  }

  let html = '';
  if (data.verdict === 'warned' && data.warning) {
    html += `<div class="result-box warned">${escapeHtml(data.warning)}</div>`;
  }

  const maxScore = Math.max(...data.ranked.map(r => r.score));
  html += '<div class="card"><table>';
  for (const r of data.ranked) {
    const pct = (r.score * 100).toFixed(1);
    const barPct = maxScore > 0 ? (r.score / maxScore * 100) : 0;
    html += `<tr>
      <td class="label">${escapeHtml(r.label)}
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
      </td>
      <td class="score">${pct}%</td>
    </tr>`;
  }
  html += '</table></div>';
  resultEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
