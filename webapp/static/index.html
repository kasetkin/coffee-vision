<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Bean Origin Classifier</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --fg: #2a1e14;
    --muted: #6b5c4d;
    --accent: #6f4527;
    --accent-fg: #fff;
    --card: #fff;
    --border: #e2d8cb;
    --warn-bg: #fff4e0;
    --warn-fg: #6b4c00;
    --refuse-bg: #fdecec;
    --refuse-fg: #7a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1611;
      --fg: #f1e9df;
      --muted: #b8a996;
      --accent: #c68a4e;
      --accent-fg: #1b1611;
      --card: #26201a;
      --border: #3a3025;
      --warn-bg: #3a2e12;
      --warn-fg: #ffd98a;
      --refuse-bg: #3a1c1c;
      --refuse-fg: #ff9d9d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 32rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; text-align: center; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  button, .file-btn {
    flex: 1;
    min-width: 8rem;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-fg);
    text-align: center;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=file] { display: none; }
  .formats-hint {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.25rem 0.6rem;
    margin-top: 0.6rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .formats-hint span {
    white-space: nowrap;
    padding: 0.1rem 0.5rem;
    border-radius: 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  #preview-wrap {
    display: none;
    position: relative;
    overflow: hidden;
    border-radius: 0.5rem;
    margin-top: 1rem;
  }
  #preview {
    display: block;
    width: 100%;
    max-height: 20rem;
    object-fit: contain;
  }
  /* object-fit: contain can letterbox #preview inside #preview-wrap (when
     the photo's aspect ratio doesn't match the wrapper's) -- #image-clip is
     a CSS clipping box sized in JS to exactly the rendered photo's own rect,
     not the wrapper's, so the tint, the outline and the box only ever cover
     actual photo pixels, never empty letterbox space. */
  #image-clip {
    position: absolute;
    display: none;
    overflow: hidden;
    pointer-events: none;
  }
  /* The photo's bean region (ticket OPS-6): #tint-canvas tints everything
     outside it, #outline-canvas draws a thin magenta line just outside its
     edge. Both are drawn by drawBeanRegion() and sit under the box. */
  #tint-canvas, #outline-canvas {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
  }
  #crop-overlay {
    position: absolute;
    display: none;
    /* The crop box as an outline only: #tint-canvas does the dimming, by
       the bean region rather than by the box (OPS-6 D3). */
    outline: 2px solid rgba(255, 255, 255, 0.9);
    /* TODO(crop editing): planned feature -- let the user drag/resize this
       box after the detector shows it, instead of only the binary
       use-detected-crop/use-full-photo toggle below. Needs: pointer-events
       auto + resize handles here (currently `none`, deliberately, since the
       box is display-only today); converting the user's edited on-screen
       rect back to fractional image coordinates (invert positionCropOverlay's
       contain-fit math); and a new field alongside the existing `skip_crop`
       form field on POST /classify (e.g. `crop_box`) for classify_one() to
       apply -- same trust boundary as today: the server decides what "apply
       this box" means, the client only ever supplies numbers, same as
       skip_crop is one bit today, not a box. */
  }
  #outline-label {
    display: none;
    width: fit-content;
    margin: 0.5rem auto 0;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
  }
  #crop-note {
    display: none;
    margin-top: 0.4rem;
    color: var(--warn-fg);
    font-size: 0.85rem;
    text-align: center;
  }
  #crop-toggle-btn {
    display: none;
    width: fit-content;
    margin: 0.5rem auto 0;
    padding: 0.3rem 0.8rem;
    border-radius: 1rem;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 500;
    flex: none;
    min-width: 0;
  }
  #status { margin-top: 0.75rem; color: var(--muted); font-size: 0.95rem; text-align: center; }
  .result-box {
    padding: 0.9rem 1rem;
    border-radius: 0.5rem;
    margin-top: 0.5rem;
    line-height: 1.4;
  }
  .result-box.refused { background: var(--refuse-bg); color: var(--refuse-fg); }
  .result-box.warned { background: var(--warn-bg); color: var(--warn-fg); margin-bottom: 0.75rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  td { padding: 0.4rem 0.2rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  td.label { color: var(--fg); }
  td.score { text-align: right; color: var(--muted); white-space: nowrap; }
  tr:first-child td { font-weight: 700; color: var(--fg); }
  .bar-track { background: var(--border); border-radius: 3px; height: 6px; margin-top: 4px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
</style>
</head>
<body>
<main>
  <h1>Coffee Bean Origin Classifier</h1>

  <div class="card">
    <div class="controls">
      <label class="file-btn" for="photo-input">Choose Photo</label>
      <button id="classify-btn" disabled>Classify</button>
    </div>
    <div class="formats-hint">
      <span>JPG</span><span>PNG</span><span>WEBP</span><span>HEIC/HEIF</span>
      <span>AVIF</span><span>JPEG XL/JXL</span><span>RAW (DNG, CR2, NEF, ARW, &hellip;)</span>
    </div>
    <input id="photo-input" type="file"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,image/jxl,image/x-adobe-dng,image/x-canon-cr2,image/x-canon-cr3,image/x-nikon-nef,image/x-sony-arw,image/x-fuji-raf,image/x-olympus-orf,image/x-panasonic-rw2,.jpg,.jpeg,.png,.webp,.heic,.heif,.avif,.jxl,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.pef,.srw"
           capture="environment">
    <div id="preview-wrap">
      <img id="preview" alt="Selected photo preview">
      <div id="image-clip">
        <canvas id="tint-canvas"></canvas>
        <canvas id="outline-canvas"></canvas>
        <div id="crop-overlay"></div>
      </div>
    </div>
    <label id="outline-label"><input id="outline-toggle" type="checkbox" checked> Show outline</label>
    <button id="crop-toggle-btn" type="button"></button>
    <div id="crop-note"></div>
    <div id="status"></div>
  </div>

  <div id="result"></div>
</main>

<script>
const fileInput = document.getElementById('photo-input');
const preview = document.getElementById('preview');
const previewWrap = document.getElementById('preview-wrap');
const imageClip = document.getElementById('image-clip');
const tintCanvas = document.getElementById('tint-canvas');
const outlineCanvas = document.getElementById('outline-canvas');
const outlineLabel = document.getElementById('outline-label');
const outlineToggle = document.getElementById('outline-toggle');
const cropOverlay = document.getElementById('crop-overlay');
const cropNote = document.getElementById('crop-note');
const cropToggleBtn = document.getElementById('crop-toggle-btn');
const classifyBtn = document.getElementById('classify-btn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

let previewUrl = null;
let lastCropBox = null; // [x0, y0, x1, y1] as fractions of the full image, or null
// The photo's bean region from /crop (ticket OPS-6 D7): the decoded mask
// image, opaque on bean pixels and transparent elsewhere, covering the whole
// photo; or null (no mask, or not decoded yet).
let lastMask = null;
// User override: the detector found a box, but they don't trust it. Only
// meaningful when lastCropBox is set -- there's nothing to override on a
// photo the detector left untouched.
let useFullPhoto = false;

function updateCropToggleBtn() {
  cropToggleBtn.textContent = useFullPhoto ? 'Use detected crop' : 'Use full photo instead';
}
cropToggleBtn.addEventListener('click', () => {
  useFullPhoto = !useFullPhoto;
  updateCropToggleBtn();
  positionCropOverlay();
});

// The overlay is positioned in *displayed* pixels, but #preview uses
// object-fit: contain -- the image is letterboxed inside its own box
// whenever the container's aspect ratio doesn't match the photo's. A plain
// CSS-percentage overlay would misalign in that case, so this maps fractional
// crop coordinates through the same contain-fit math the browser uses.
// #image-clip is sized to exactly the rendered photo's own rect (not the
// wrapper's) so the tint, the outline and the box only ever cover actual
// photo pixels, never the letterbox margin around it. The one place that
// draws: it runs on the preview's load, on the /crop answer and on resize,
// and draws the bean region only once both the preview and the mask loaded.
function positionCropOverlay() {
  if (!lastCropBox || !preview.naturalWidth || useFullPhoto) {
    imageClip.style.display = 'none';
    outlineLabel.style.display = 'none';
    return;
  }
  const cw = previewWrap.clientWidth, ch = previewWrap.clientHeight;
  const iw = preview.naturalWidth, ih = preview.naturalHeight;
  const scale = Math.min(cw / iw, ch / ih);
  const dispW = iw * scale, dispH = ih * scale;
  const offX = (cw - dispW) / 2, offY = (ch - dispH) / 2;
  imageClip.style.left = `${offX}px`;
  imageClip.style.top = `${offY}px`;
  imageClip.style.width = `${dispW}px`;
  imageClip.style.height = `${dispH}px`;
  imageClip.style.display = 'block';

  const [x0, y0, x1, y1] = lastCropBox;
  cropOverlay.style.left = `${x0 * dispW}px`;
  cropOverlay.style.top = `${y0 * dispH}px`;
  cropOverlay.style.width = `${(x1 - x0) * dispW}px`;
  cropOverlay.style.height = `${(y1 - y0) * dispH}px`;
  cropOverlay.style.display = 'block';

  if (lastMask) {
    drawBeanRegion(dispW, dispH);
    tintCanvas.style.display = 'block';
    showOutline();
    outlineLabel.style.display = 'block';
  } else {
    tintCanvas.style.display = 'none';
    outlineCanvas.style.display = 'none';
    outlineLabel.style.display = 'none';
  }
}
window.addEventListener('resize', positionCropOverlay);

// "Show outline" (OPS-6 D9) shows or hides the outline's canvas only, with
// no redraw; its state lasts across uploads in this page visit, not saved.
function showOutline() {
  outlineCanvas.style.display = outlineToggle.checked ? 'block' : 'none';
}
outlineToggle.addEventListener('change', showOutline);

const OUTLINE_CSS_PX = 2;
const OUTLINE_STEPS = 16;

// Ticket OPS-6 D14: composited from the mask, never read back pixel by
// pixel (the noise some browsers add to readback cannot reach the overlay).
// The canvas covers the photo's displayed rect at device pixels, and every
// drawImage stretches the mask to the whole canvas, as the box's fractions
// are stretched to the same rect (D7).
function drawBeanRegion(dispW, dispH) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(dispW * dpr)), h = Math.max(1, Math.round(dispH * dpr));
  for (const canvas of [tintCanvas, outlineCanvas]) {
    canvas.width = w;   // setting the size also clears the canvas
    canvas.height = h;
    canvas.style.width = `${dispW}px`;
    canvas.style.height = `${dispH}px`;
  }

  // The tint (D4): 55% black everywhere, then the bean region cut out.
  const tint = tintCanvas.getContext('2d');
  tint.fillStyle = 'rgba(0, 0, 0, 0.55)';
  tint.fillRect(0, 0, w, h);
  tint.globalCompositeOperation = 'destination-out';
  tint.drawImage(lastMask, 0, 0, w, h);
  tint.globalCompositeOperation = 'source-over';

  // The outline (D9, D14): the mask at 16 offsets on a circle of 2 CSS px is
  // the bean region widened by 2 px; cutting the mask itself out leaves a
  // ring just outside its edge, over the tint and covering no bean pixel
  // (D2); source-in paints the ring magenta, as the review tool's
  // (coffeecv/seg_overlay.py). What lies beyond the canvas is cut off, so the
  // photo's own border never gets a line.
  const outline = outlineCanvas.getContext('2d');
  const r = OUTLINE_CSS_PX * dpr;
  for (let i = 0; i < OUTLINE_STEPS; i++) {
    const a = 2 * Math.PI * i / OUTLINE_STEPS;
    outline.drawImage(lastMask, r * Math.cos(a), r * Math.sin(a), w, h);
  }
  outline.globalCompositeOperation = 'destination-out';
  outline.drawImage(lastMask, 0, 0, w, h);
  outline.globalCompositeOperation = 'source-in';
  outline.fillStyle = 'rgb(255, 0, 255)';
  outline.fillRect(0, 0, w, h);
  outline.globalCompositeOperation = 'source-over';
}

// Ticket OPS-6 D13: each pick of a photo is a new upload. The file input
// stays enabled while /preview and /crop run, so an answer can arrive after
// the user picked another photo; the handler checks its upload is still the
// current one after every wait and drops a stale answer before it touches
// the preview, the box, the canvases, the note or the status.
let currentUpload = 0;

fileInput.addEventListener('change', async () => {
  const upload = ++currentUpload;
  const isStale = () => upload !== currentUpload;
  const file = fileInput.files[0];
  resultEl.innerHTML = '';
  previewWrap.style.display = 'none';
  imageClip.style.display = 'none';
  cropOverlay.style.display = 'none';
  tintCanvas.style.display = 'none';
  outlineCanvas.style.display = 'none';
  outlineLabel.style.display = 'none';
  cropNote.style.display = 'none';
  cropToggleBtn.style.display = 'none';
  classifyBtn.disabled = true;
  lastCropBox = null;
  lastMask = null;
  useFullPhoto = false;
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
  if (!file) {
    statusEl.textContent = '';
    return;
  }

  // Always converted server-side to JPEG (POST /preview), not shown directly
  // from the file the browser was given -- some formats this app accepts
  // (HEIC/HEIF especially) aren't natively decodable by most browsers' <img>,
  // only Safari can preview those directly. The server already has to decode
  // every format to classify it, so reusing that here guarantees the preview
  // always renders, in any browser, and shows exactly what the model sees.
  statusEl.textContent = 'Loading preview...';
  try {
    const previewData = new FormData();
    previewData.append('photo', file);
    const res = await fetch('/preview', { method: 'POST', body: previewData });
    if (isStale()) return;
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      if (isStale()) return;
      statusEl.textContent = '';
      renderRefused(data.error || "Could not read this photo.");
      return;
    }
    const blob = await res.blob();
    if (isStale()) return;
    previewUrl = URL.createObjectURL(blob);
    preview.onload = positionCropOverlay;
    preview.src = previewUrl;
    previewWrap.style.display = 'block';

    // /crop runs after /preview, not alongside it: the backend is a single
    // gunicorn worker with a server-wide cap of one in-flight request (see
    // webapp/deploy/coffee-cv.nginx.conf.template), so firing both at once
    // would just queue or 503 the second one. Sequential also reads better --
    // the photo appears immediately, the framing outline fades in a moment
    // after. Classify stays disabled until this settles, for the same
    // concurrency-cap reason: clicking it while /crop is still in flight
    // would race it for that single slot and get an HTML 503 error page back
    // instead of JSON, which then fails to parse client-side. A /crop
    // failure still degrades to "no overlay" rather than blocking Classify
    // forever -- /preview already succeeding means the photo itself is
    // readable, and classify_one() recomputes its own crop regardless of
    // whatever this call returns.
    statusEl.textContent = 'Checking framing...';
    try {
      const cropData = new FormData();
      cropData.append('photo', file);
      const cropRes = await fetch('/crop', { method: 'POST', body: cropData });
      if (isStale()) return;
      if (cropRes.ok) {
        const data = await cropRes.json();
        if (isStale()) return;
        // The mask decodes first, so the box and the bean region appear
        // together. An answer with no mask field (a page cached from this
        // release against a rolled-back server, OPS-6 R6) or a mask that
        // fails to decode shows the box only.
        let mask = null;
        if (data.mask) {
          const img = new Image();
          img.src = `data:image/png;base64,${data.mask}`;
          try {
            await img.decode();
            mask = img;
          } catch (err) {
            // box only
          }
          if (isStale()) return;
        }
        lastCropBox = data.cropped ? data.box : null;
        lastMask = mask;
        if (lastCropBox) {
          updateCropToggleBtn();
          cropToggleBtn.style.display = 'block';
        }
        positionCropOverlay();
        // The two notes cannot fire together: a segmenter model's
        // needs_review is always false (coffeecv/infer.py).
        if (data.seg_fallback) {
          // ML-2 D18: no usable mask, so the whole photo is classified. A
          // note, not a refusal (OPS-6 D5).
          cropNote.textContent = 'No coffee beans found -- the whole photo will be classified.';
          cropNote.style.display = 'block';
        } else if (data.needs_review) {
          cropNote.textContent = 'Framing looks a bit uncertain -- classification will still run.';
          cropNote.style.display = 'block';
        }
      }
    } catch (err) {
      if (isStale()) return;
      // no overlay, no warning -- Classify is unaffected either way
    }
    classifyBtn.disabled = false;
    statusEl.textContent = '';
  } catch (err) {
    if (isStale()) return;
    statusEl.textContent = '';
    renderRefused('Could not reach the server -- check your connection and try again.');
  }
});

classifyBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  classifyBtn.disabled = true;
  fileInput.disabled = true;
  resultEl.innerHTML = '';
  statusEl.textContent = 'Analyzing... (this takes several seconds)';

  const formData = new FormData();
  formData.append('photo', file);
  if (useFullPhoto) {
    formData.append('skip_crop', '1');
  }

  try {
    const res = await fetch('/classify', { method: 'POST', body: formData });
    const data = await res.json();
    statusEl.textContent = '';
    if (!res.ok) {
      renderRefused(data.error || 'Something went wrong -- try a different photo.');
    } else {
      render(data);
    }
  } catch (err) {
    statusEl.textContent = '';
    renderRefused('Could not reach the server -- check your connection and try again.');
  } finally {
    classifyBtn.disabled = false;
    fileInput.disabled = false;
  }
});

function renderRefused(message) {
  resultEl.innerHTML = `<div class="result-box refused">${escapeHtml(message)}</div>`;
}

function render(data) {
  if (data.verdict === 'refused_scale' || data.verdict === 'refused_ood' || data.verdict === 'refused_unreadable') {
    renderRefused(data.message);
    return;
  }

  let html = '';
  if (data.verdict === 'warned' && data.warning) {
    html += `<div class="result-box warned">${escapeHtml(data.warning)}</div>`;
  }

  const maxScore = Math.max(...data.ranked.map(r => r.score));
  html += '<div class="card"><table>';
  for (const r of data.ranked) {
    const pct = (r.score * 100).toFixed(1);
    const barPct = maxScore > 0 ? (r.score / maxScore * 100) : 0;
    html += `<tr>
      <td class="label">${escapeHtml(r.label)}
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
      </td>
      <td class="score">${pct}%</td>
    </tr>`;
  }
  html += '</table></div>';
  resultEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
