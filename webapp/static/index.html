<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Bean Origin Classifier</title>
<meta name="description" content="Take a phone photo of whole coffee beans, green or roasted, and get the country the coffee was most likely grown in, or a refusal when the photo does not look like the beans the model knows.">
<link rel="service-desc" type="application/vnd.oai.openapi+json" href="/openapi.json">
<link rel="ard" type="application/json" href="/.well-known/ard.json">
<link rel="alternate" type="text/markdown" title="Guide for agents" href="/llms.txt">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --fg: #2a1e14;
    --muted: #6b5c4d;
    --accent: #6f4527;
    --accent-fg: #fff;
    --card: #fff;
    --border: #e2d8cb;
    --warn-bg: #fff4e0;
    --warn-fg: #6b4c00;
    --refuse-bg: #fdecec;
    --refuse-fg: #7a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1611;
      --fg: #f1e9df;
      --muted: #b8a996;
      --accent: #c68a4e;
      --accent-fg: #1b1611;
      --card: #26201a;
      --border: #3a3025;
      --warn-bg: #3a2e12;
      --warn-fg: #ffd98a;
      --refuse-bg: #3a1c1c;
      --refuse-fg: #ff9d9d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 32rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; text-align: center; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  button, .file-btn {
    flex: 1;
    min-width: 8rem;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-fg);
    text-align: center;
  }
  button:disabled, .file-btn.disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=file] { display: none; }
  /* Beside the camera button, the text buttons' line set, so its square matches their height (ticket OPS-21 D1); a
     desktop, with no camera button, keeps its line as before (D2). */
  .controls.with-camera .file-btn { line-height: 1.25rem; }
  /* The camera button (ticket OPS-21 D1, D12, D13): a square as tall as a text button with one line, 1.25rem of line
     and 0.75rem of padding each side; it keeps that height when a text button's words take two lines. */
  .file-btn.camera-btn {
    flex: none;
    min-width: 0;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* display: flex above wins over the hidden attribute's own display: none, as for the format chips (OPS-20). */
  .file-btn.camera-btn[hidden] { display: none; }
  .camera-btn svg { width: 1.4rem; height: 1.4rem; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }
  /* Android's three controls on one line at any width (ticket OPS-21 D12, R7): each text button as wide as its words
     with less side padding, the two sharing what the square leaves; under about 360 px their words may take two
     lines. */
  .controls.android { flex-wrap: nowrap; gap: 0.5rem; }
  .controls.android .file-btn:not(.camera-btn) { flex: 1 1 auto; min-width: 0; padding: 0.75rem 0.5rem; }
  /* The line of buttons that open the lists (ticket OPS-20 D3): smaller and lighter than the upload controls, as
     "Use full photo instead" is, so those stay the main actions and nothing wraps on a narrow phone (R3). */
  .folds { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 0.6rem; }
  button.fold {
    flex: none;
    min-width: 0;
    padding: 0.25rem 0.75rem;
    border-radius: 1rem;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 500;
  }
  .formats-hint {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.25rem 0.6rem;
    margin-top: 0.6rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  /* display: flex above wins over the hidden attribute's own display: none, so the folded list needs this (OPS-20). */
  .formats-hint[hidden] { display: none; }
  .formats-hint span {
    white-space: nowrap;
    padding: 0.1rem 0.5rem;
    border-radius: 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  /* The example photos (ticket OPS-16 D10): a row of thumbnails under Choose Photo, each captioned with its setting. */
  #examples { margin-top: 1rem; }
  .examples-title { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.9rem; text-align: center; }
  #example-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
  #example-row button.example {
    flex: 0 1 6rem;
    min-width: 0;
    padding: 0.3rem;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.2;
  }
  #example-row img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 0.3rem; }
  #example-row span { display: block; margin-top: 0.3rem; }
  #preview-wrap {
    display: none;
    position: relative;
    overflow: hidden;
    border-radius: 0.5rem;
    margin-top: 1rem;
  }
  #preview {
    display: block;
    width: 100%;
    max-height: 20rem;
    object-fit: contain;
  }
  /* object-fit: contain can letterbox #preview inside #preview-wrap (when
     the photo's aspect ratio doesn't match the wrapper's) -- #image-clip is
     a CSS clipping box sized in JS to exactly the rendered photo's own rect,
     not the wrapper's, so the tint, the outline and the box only ever cover
     actual photo pixels, never empty letterbox space. */
  #image-clip {
    position: absolute;
    display: none;
    overflow: hidden;
    pointer-events: none;
  }
  /* The photo's bean region (ticket OPS-6): #tint-canvas tints everything
     outside it, #outline-canvas draws a thin magenta line just outside its
     edge. Both are drawn by drawBeanRegion() and sit under the box. */
  #tint-canvas, #outline-canvas {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
  }
  #crop-overlay {
    position: absolute;
    display: none;
    /* The crop box as an outline only: #tint-canvas does the dimming, by
       the bean region rather than by the box (OPS-6 D3). */
    outline: 2px solid rgba(255, 255, 255, 0.9);
    /* TODO(crop editing): planned feature -- let the user drag/resize this
       box after the detector shows it, instead of only the binary
       use-detected-crop/use-full-photo toggle below. Needs: pointer-events
       auto + resize handles here (currently `none`, deliberately, since the
       box is display-only today); converting the user's edited on-screen
       rect back to fractional image coordinates (invert renderOverlay's
       contain-fit math); and a new field alongside the existing `skip_crop`
       form field on POST /analyze (e.g. `crop_box`) for classify_one() to
       apply -- same trust boundary as today: the server decides what "apply
       this box" means, the client only ever supplies numbers, same as
       skip_crop is one bit today, not a box. The server holds no photo
       between requests (ADR 0023), so an edited box is a second upload of
       the photo, carrying the edit, as "Use full photo instead" is. */
  }
  #outline-label {
    display: none;
    width: fit-content;
    margin: 0.5rem auto 0;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
  }
  #crop-note {
    display: none;
    margin-top: 0.4rem;
    color: var(--warn-fg);
    font-size: 0.85rem;
    text-align: center;
  }
  #crop-toggle-btn {
    display: none;
    width: fit-content;
    margin: 0.5rem auto 0;
    padding: 0.3rem 0.8rem;
    border-radius: 1rem;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 500;
    flex: none;
    min-width: 0;
  }
  /* The rotating progress circle (ticket OPS-7 D3): from the pick until the
     preview, then under the preview until the classification. */
  #spinner {
    display: none;
    width: 2rem;
    height: 2rem;
    margin: 1rem auto 0;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #spinner { animation-duration: 2.5s; } }
  /* What the wait is, under the circle (ticket OPS-15 D16): only while the photo crosses to the classifier. */
  #progress-note {
    display: none;
    margin-top: 0.5rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .result-box {
    padding: 0.9rem 1rem;
    border-radius: 0.5rem;
    margin-top: 0.5rem;
    line-height: 1.4;
  }
  .result-box.refused { background: var(--refuse-bg); color: var(--refuse-fg); }
  .result-box.warned { background: var(--warn-bg); color: var(--warn-fg); margin-bottom: 0.75rem; }
  /* What an example photo really is (ticket OPS-16 D10), under the answer: never shown for a visitor's own photo. */
  .result-box.truth { border: 1px solid var(--border); margin-top: 0.75rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  td { padding: 0.4rem 0.2rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  td.label { color: var(--fg); }
  td.score { text-align: right; color: var(--muted); white-space: nowrap; }
  tr:first-child td { font-weight: 700; color: var(--fg); }
  .bar-track { background: var(--border); border-radius: 3px; height: 6px; margin-top: 4px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
  /* What is logged (ticket OPS-3 D15): small, under the answer, on every screen. */
  #logged-note { margin: 1.5rem 0 0; font-size: 0.8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Coffee Bean Origin Classifier</h1>

  <div class="card">
    <!-- Ticket OPS-21 D14: each label names the input for iOS, desktop and any other phone; on Android the script
         points Choose Photo and the camera at Android's inputs and shows Select File (isAndroid, below). -->
    <div id="controls" class="controls">
      <label id="photo-label" class="file-btn" for="photo-input">Choose Photo</label>
      <label id="select-file-label" class="file-btn" for="select-file-input" hidden>Select File</label>
      <!-- Ticket OPS-17 D1, D2: the camera in one tap, on phones and tablets only (isMobile, below). OPS-21 D1, D8, D9,
           D13: a square, last, with a camera icon and no visible words; "Take Photo" is read aloud and is its tooltip
           (a screen reader ignores aria-label on a label). -->
      <label id="camera-label" class="file-btn camera-btn" for="camera-input" title="Take Photo" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg><span class="visually-hidden">Take Photo</span></label>
    </div>
    <!-- Ticket OPS-20 D3, D4, D7, D12: a line of its own under the upload controls, one button per list, each opening
         and folding only its own; the arrow turns and aria-expanded says which. "Examples" is shown from the first
         pick. Neither button may sit inside div.formats-hint, whose spans the format test counts as chips (R5). -->
    <div class="folds">
      <button id="formats-toggle" class="fold" type="button" aria-expanded="false" aria-controls="formats">Accepted formats <span class="arrow" aria-hidden="true">&#9656;</span></button>
      <button id="examples-toggle" class="fold" type="button" aria-expanded="false" aria-controls="examples" hidden>Examples <span class="arrow" aria-hidden="true">&#9656;</span></button>
    </div>
    <!-- The accepted formats (coffeecv/data/accepted_formats.csv, ADR 0034): these chips and every accept list are held
         to the file by tests/test_accepted_formats_named.py. Folded from load (ticket OPS-20 D5). -->
    <div id="formats" class="formats-hint" hidden>
      <span>JPEG</span><span>PNG</span><span>WebP</span><span>HEIC/HEIF</span><span>AVIF</span>
      <span>JPEG XL</span><span>GIF</span><span>BMP</span><span>camera RAW (DNG, CR2, NEF, ARW, &hellip;)</span>
    </div>
    <!-- Ticket OPS-16 D10, D13: built from /examples/examples.json; stays hidden if the list cannot be read. Shown in
         full until the first pick, folded behind "Examples" from then on (ticket OPS-20 D1, D2). -->
    <div id="examples" hidden>
      <p class="examples-title">No photo? Try one of ours:</p>
      <div id="example-row"></div>
    </div>
    <!-- Ticket OPS-17 D1: Choose Photo has no capture attribute, so a phone offers the photos it already has; Take
         Photo has it, and opens the rear camera. Both take the same formats. -->
    <input id="photo-input" type="file"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,image/jxl,image/gif,image/bmp,image/x-adobe-dng,image/x-canon-cr2,image/x-canon-cr3,image/x-nikon-nef,image/x-sony-arw,image/x-fuji-raf,image/x-olympus-orf,image/x-panasonic-rw2,.jpg,.jpeg,.png,.webp,.heic,.heif,.hif,.avif,.jxl,.gif,.bmp,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.pef,.srw">
    <input id="camera-input" type="file"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,image/jxl,image/gif,image/bmp,image/x-adobe-dng,image/x-canon-cr2,image/x-canon-cr3,image/x-nikon-nef,image/x-sony-arw,image/x-fuji-raf,image/x-olympus-orf,image/x-panasonic-rw2,.jpg,.jpeg,.png,.webp,.heic,.heif,.hif,.avif,.jxl,.gif,.bmp,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.pef,.srw"
           capture="environment">
    <!-- Ticket OPS-21, Android only (D2, D6): what Chrome and Firefox open follows from the accept list. Choose Photo
         has the MIME types alone, since an extension keeps Chrome from its photo picker (D3); Select File names no
         image type, so neither browser offers the camera (D4), and is one made-up extension no MIME table knows, which
         Chrome opens unfiltered as application/octet-stream and Firefox as */*: under application/octet-stream itself
         Firefox's Files greyed out every photo (D11); the camera has any image and capture, the one list Chrome opened
         the camera with directly (D1). Firefox opens its Camera / Files chooser for it (Bug 1911552). -->
    <input id="android-photo-input" type="file"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,image/jxl,image/gif,image/bmp,image/x-adobe-dng,image/x-canon-cr2,image/x-canon-cr3,image/x-nikon-nef,image/x-sony-arw,image/x-fuji-raf,image/x-olympus-orf,image/x-panasonic-rw2">
    <input id="select-file-input" type="file" accept=".coffeecv">
    <input id="android-camera-input" type="file" accept="image/*" capture="environment">
    <div id="preview-wrap">
      <img id="preview" alt="Selected photo preview">
      <div id="image-clip">
        <canvas id="tint-canvas"></canvas>
        <canvas id="outline-canvas"></canvas>
        <div id="crop-overlay"></div>
      </div>
    </div>
    <label id="outline-label"><input id="outline-toggle" type="checkbox" checked> Show outline</label>
    <button id="crop-toggle-btn" type="button"></button>
    <div id="crop-note"></div>
    <div id="spinner" role="status" aria-label="Working"></div>
    <div id="progress-note" aria-live="polite"></div>
  </div>

  <div id="result"></div>
  <!-- Ticket OPS-3 D15: what the logs hold, as built (docs/logging_plan.html §03-G); llms.txt says the same, and
       tests/test_agent_files.py holds the two to each other and to the code. -->
  <p id="logged-note">We log each photo's file name, type and size, how it was picked, how long each step took, the browser's name and the page that linked here, not the photo.</p>
</main>

<script>
const fileInput = document.getElementById('photo-input');
const preview = document.getElementById('preview');
const previewWrap = document.getElementById('preview-wrap');
const imageClip = document.getElementById('image-clip');
const tintCanvas = document.getElementById('tint-canvas');
const outlineCanvas = document.getElementById('outline-canvas');
const outlineLabel = document.getElementById('outline-label');
const outlineToggle = document.getElementById('outline-toggle');
const cropOverlay = document.getElementById('crop-overlay');
const cropNote = document.getElementById('crop-note');
const cropToggleBtn = document.getElementById('crop-toggle-btn');
const photoLabel = document.getElementById('photo-label');
const cameraInput = document.getElementById('camera-input');
const cameraLabel = document.getElementById('camera-label');
const controls = document.getElementById('controls');
const androidPhotoInput = document.getElementById('android-photo-input');
const selectFileInput = document.getElementById('select-file-input');
const selectFileLabel = document.getElementById('select-file-label');
const androidCameraInput = document.getElementById('android-camera-input');
// Every input a visitor picks a photo with, and every control that opens one (OPS-17, OPS-21 D14).
const pickInputs = [fileInput, cameraInput, androidPhotoInput, selectFileInput, androidCameraInput];
const pickLabels = [photoLabel, selectFileLabel, cameraLabel];
const spinner = document.getElementById('spinner');
const progressNote = document.getElementById('progress-note');
const resultEl = document.getElementById('result');
const examplesEl = document.getElementById('examples');
const exampleRow = document.getElementById('example-row');
const formatsToggle = document.getElementById('formats-toggle');
const examplesToggle = document.getElementById('examples-toggle');

let lastCropBox = null; // [x0, y0, x1, y1] as fractions of the full image, or null
// The photo's bean region from the preview part (ticket OPS-6 D7): the decoded
// mask image, opaque on bean pixels and transparent elsewhere, covering the
// whole photo; or null (no mask, or not decoded yet).
let lastMask = null;
// The photo on the page, for "Use full photo instead" (ticket OPS-7 D1), which
// uploads it again: the server keeps nothing between requests (ADR 0023).
let lastFile = null;
// The example photo lastFile is, from /examples/examples.json (ticket OPS-16 D13), or null for a visitor's own.
let lastExample = null;
// The line under an example's answer (D10): the truth, from its country; the negative has none.
const NO_BEANS_TRUTH = 'No coffee beans here: the classifier should refuse it.';
function truthFor(example) {
  return example.country === null ? NO_BEANS_TRUTH : `This coffee is from ${example.country}.`;
}

const UNREACHABLE = 'Could not reach the server -- check your connection and try again.';
const BUSY = 'The server is busy with another photo -- try again in a few seconds.';
// Ticket OPS-7 plan Q1 (open; the plan assumes its recommendation): nginx
// answers 503 at once while another visitor's photo is in flight, so a 503
// is retried after these waits, the circle spinning, before BUSY shows.
const BUSY_RETRY_S = [3, 6, 12];
// The front's answer while the classifier cannot be reached (ticket OPS-15 D12): a 503 like busy, told apart by its
// body (webapp/front/check_service.py's OFFLINE, held equal by tests/test_agent_files.py), and not retried: the
// classifier is down for minutes, not seconds.
const OFFLINE_ERROR = 'the classifier is offline';
const OFFLINE = 'The classifier is offline -- try again in a few minutes.';
// The front's cap (ticket ML-19 D23; check_service.py's MAX_UPLOAD_BYTES, held equal by the same test): a larger
// photo is refused here, before it is uploaded, since the front would refuse it after.
const MAX_UPLOAD_BYTES = 40 * 1024 * 1024;
// Once the upload has left the browser (D16): the front converts the photo, which then crosses to the classifier
// (about 40 s for 10 MB).
const SENDING = 'Sending to the classifier...';
// How the front and the app start a 400 for a file they cannot read (held to both by tests/test_agent_files.py). Ticket
// OPS-20 D6: it opens the format list, whether the format is not accepted or the photo would not decode.
const UNREADABLE_ERROR = 'could not read this as an image';

function hide(...elements) {
  for (const el of elements) el.style.display = 'none';
}

// Each photo's timeline (ticket OPS-3 D6, D7): what the browser alone knows of the photo, sent once, by beacon, to
// POST /timeline when its outcome is on screen, or when it is abandoned for another photo or the page is left. The
// hosts log the rest under the same request ID: the photo's name, format and size and every host's time. The names
// are coffeecv/timeline_schema.py's (held equal by tests/test_timeline_schema.py), which says what each time measures;
// all are on performance.now(). A beacon that fails is dropped: the page never waits on it, retries it or shows it.
const TIMELINE_VERSION = 1;
const TIMELINE_CONTROLS = ['choose_photo', 'select_file', 'camera', 'example'];
const TIMELINE_OUTCOMES = ['answered', 'failed', 'refused_on_page', 'refused', 'busy', 'offline', 'unreachable', 'cut',
                           'abandoned', 'download_failed'];
const TIMELINE_TIMES = ['pick_ms', 'download_ms', 'size_check_ms', 'to_preview_ms', 'preview_drawn_ms', 'to_answer_ms',
                        'answer_shown_ms', 'total_ms'];
const TIMELINE_ATTEMPT_TIMES = ['connect_ms', 'upload_ms', 'headers_ms', 'wait_ms'];
const TIMELINE_MAX_MS = 600000;
const REQUEST_ID = /^[0-9a-f]{32}$/;   // the front's (OPS-3 D8); anything else is not sent
// Which control an input is (OPS-17 D7): Choose Photo is one control on every platform, the camera button another.
const CONTROL_OF_INPUT = new Map([[fileInput, 'choose_photo'], [androidPhotoInput, 'choose_photo'],
                                  [selectFileInput, 'select_file'], [cameraInput, 'camera'],
                                  [androidCameraInput, 'camera']]);

let tapAt = null;   // when a photo control was last tapped: step 1 runs from here to the file arriving
for (const label of pickLabels) label.addEventListener('click', () => { tapAt = performance.now(); });

// The photo in flight's timeline until it is sent (run), and the last one started (lastRun), which "Use full photo
// instead" names.
let run = null, lastRun = null;

function startRun(control, example, t0, rerunOf) {
  endRun('abandoned');
  run = lastRun = {t0, control, example: example ? example.name : null, rerunOf: rerunOf || null, times: {},
                   attempts: [], sentAt: null, requestId: null, ended: false};
  return run;
}

function mark(r, name, since) {
  r.times[name] = performance.now() - since;
}

// Whole milliseconds in the schema's range, or null for a time that was never taken.
function wholeMs(value) {
  return Number.isFinite(value) ? Math.min(TIMELINE_MAX_MS, Math.max(0, Math.round(value))) : null;
}

// From one moment to another, or null when either was never reached.
function span(from, to) {
  return from === null || to === null ? null : to - from;
}

// Step 4: the connection's setup for one attempt, from its Resource Timing entry when the browser gives one; zero on a
// connection already open.
function connectMs(attempt) {
  let best = null;
  for (const e of performance.getEntriesByType('resource')) {
    if (e.initiatorType !== 'xmlhttprequest' || !e.name.endsWith('/analyze')) continue;
    const gap = Math.abs(e.startTime - attempt.start);
    if (gap < 100 && (!best || gap < Math.abs(best.startTime - attempt.start))) best = e;
  }
  return best && best.domainLookupStart > 0 ? best.connectEnd - best.domainLookupStart : null;
}

// Timelines ended but not yet sent: each waits for its uploads' requests to end, since only then does the browser
// give their Resource Timing (step 4), at most TIMELINE_HOLD_MS; leaving the page sends them at once.
const TIMELINE_HOLD_MS = 2000;
const unsent = new Set();

function endRun(outcome, r = run) {
  if (!r || r.ended) return;
  r.ended = true;
  if (run === r) run = null;
  r.times.total_ms = performance.now() - r.t0;
  const last = r.attempts[r.attempts.length - 1];
  r.requestId = last ? last.requestId : null;
  const body = {v: TIMELINE_VERSION, request_id: r.requestId, control: r.control, outcome};
  if (r.example) body.example = r.example;
  if (r.rerunOf) body.rerun_of = r.rerunOf;
  for (const name of TIMELINE_TIMES) {
    const ms = wholeMs(r.times[name]);
    if (ms !== null) body[name] = ms;
  }
  let sent = false;
  const sendNow = () => {
    if (sent) return;
    sent = true;
    unsent.delete(sendNow);
    body.attempts = r.attempts.map(a => {
      const out = {request_id: a.requestId, status: a.status};
      const times = {connect_ms: connectMs(a), upload_ms: span(a.start, a.sentAt), headers_ms: span(a.sentAt, a.headersAt),
                     wait_ms: a.waitMs};
      for (const name of TIMELINE_ATTEMPT_TIMES) {
        const ms = wholeMs(times[name]);
        if (ms !== null) out[name] = ms;
      }
      return out;
    });
    try {
      navigator.sendBeacon('/timeline', JSON.stringify(body));
    } catch (err) {
      // dropped (D7)
    }
  };
  unsent.add(sendNow);
  Promise.race([Promise.all(r.attempts.map(a => a.done)),
                new Promise(resolve => setTimeout(resolve, TIMELINE_HOLD_MS))]).then(sendNow);
}
window.addEventListener('pagehide', () => {
  endRun('abandoned');
  for (const sendNow of [...unsent]) sendNow();
});

// "Use full photo instead" (ticket OPS-7 D1, D14): shown after a
// classification of a cropped photo; it classifies the whole photo, with one
// more upload, and does not come back. Going back to the cropped answer means
// picking the photo again.
cropToggleBtn.textContent = 'Use full photo instead';
cropToggleBtn.addEventListener('click', () => {
  if (!lastFile) return;
  resultEl.innerHTML = '';
  lastCropBox = null;
  lastMask = null;
  renderOverlay();
  hide(cropToggleBtn, cropNote);
  const first = lastRun;
  const r = startRun(first.control, lastExample, performance.now(), first.requestId);
  analyze(lastFile, true, lastExample, r);
});

// The overlay is positioned in *displayed* pixels, but #preview uses
// object-fit: contain -- the image is letterboxed inside its own box
// whenever the container's aspect ratio doesn't match the photo's. A plain
// CSS-percentage overlay would misalign in that case, so this maps fractional
// crop coordinates through the same contain-fit math the browser uses.
// #image-clip is sized to exactly the rendered photo's own rect (not the
// wrapper's) so the tint, the outline and the box only ever cover actual
// photo pixels, never the letterbox margin around it. The one place that
// draws: it runs on the preview's load, on the preview part and on resize,
// and draws the bean region only once both the preview and the mask loaded.
function renderOverlay() {
  if (!lastCropBox || !preview.naturalWidth) {
    hide(imageClip, outlineLabel);
    return;
  }
  const cw = previewWrap.clientWidth, ch = previewWrap.clientHeight;
  const iw = preview.naturalWidth, ih = preview.naturalHeight;
  const scale = Math.min(cw / iw, ch / ih);
  const dispW = iw * scale, dispH = ih * scale;
  const offX = (cw - dispW) / 2, offY = (ch - dispH) / 2;
  imageClip.style.left = `${offX}px`;
  imageClip.style.top = `${offY}px`;
  imageClip.style.width = `${dispW}px`;
  imageClip.style.height = `${dispH}px`;
  imageClip.style.display = 'block';

  const [x0, y0, x1, y1] = lastCropBox;
  cropOverlay.style.left = `${x0 * dispW}px`;
  cropOverlay.style.top = `${y0 * dispH}px`;
  cropOverlay.style.width = `${(x1 - x0) * dispW}px`;
  cropOverlay.style.height = `${(y1 - y0) * dispH}px`;
  cropOverlay.style.display = 'block';

  if (lastMask) {
    drawBeanRegion(dispW, dispH);
    tintCanvas.style.display = 'block';
    applyOutlineToggle();
    outlineLabel.style.display = 'block';
  } else {
    hide(tintCanvas, outlineCanvas, outlineLabel);
  }
}
window.addEventListener('resize', renderOverlay);

// "Show outline" (OPS-6 D9) shows or hides the outline's canvas only, with
// no redraw; its state lasts across uploads in this page visit, not saved.
function applyOutlineToggle() {
  outlineCanvas.style.display = outlineToggle.checked ? 'block' : 'none';
}
outlineToggle.addEventListener('change', applyOutlineToggle);

const OUTLINE_CSS_PX = 2;
const OUTLINE_STEPS = 16;

// Ticket OPS-6 D14: composited from the mask, never read back pixel by
// pixel (the noise some browsers add to readback cannot reach the overlay).
// The canvas covers the photo's displayed rect at device pixels, and every
// drawImage stretches the mask to the whole canvas, as the box's fractions
// are stretched to the same rect (D7).
function drawBeanRegion(dispW, dispH) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(dispW * dpr)), h = Math.max(1, Math.round(dispH * dpr));
  for (const canvas of [tintCanvas, outlineCanvas]) {
    canvas.width = w;   // setting the size also clears the canvas
    canvas.height = h;
    canvas.style.width = `${dispW}px`;
    canvas.style.height = `${dispH}px`;
  }

  // The tint (D4): 55% black everywhere, then the bean region cut out.
  const tint = tintCanvas.getContext('2d');
  tint.fillStyle = 'rgba(0, 0, 0, 0.55)';
  tint.fillRect(0, 0, w, h);
  tint.globalCompositeOperation = 'destination-out';
  tint.drawImage(lastMask, 0, 0, w, h);
  tint.globalCompositeOperation = 'source-over';

  // The outline (D9, D14): the mask at 16 offsets on a circle of 2 CSS px is
  // the bean region widened by 2 px; cutting the mask itself out leaves a
  // ring just outside its edge, over the tint and covering no bean pixel
  // (D2); source-in paints the ring magenta, as the review tool's
  // (coffeecv/seg_overlay.py). What lies beyond the canvas is cut off, so the
  // photo's own border never gets a line.
  const outline = outlineCanvas.getContext('2d');
  const r = OUTLINE_CSS_PX * dpr;
  for (let i = 0; i < OUTLINE_STEPS; i++) {
    const a = 2 * Math.PI * i / OUTLINE_STEPS;
    outline.drawImage(lastMask, r * Math.cos(a), r * Math.sin(a), w, h);
  }
  outline.globalCompositeOperation = 'destination-out';
  outline.drawImage(lastMask, 0, 0, w, h);
  outline.globalCompositeOperation = 'source-in';
  outline.fillStyle = 'rgb(255, 0, 255)';
  outline.fillRect(0, 0, w, h);
  outline.globalCompositeOperation = 'source-over';
}

// Ticket OPS-6 D13: each upload has a token, and an answer for an upload
// that is no longer the current one is dropped before it touches the page.
// Every photo control is disabled while a photo is in flight (OPS-7 D4), so this is a
// guard, not the main defence.
let currentUpload = 0;

for (const input of pickInputs) {
  input.addEventListener('change', () => {
    const file = input.files[0];
    // Emptied once read, so picking the same photo again -- what "busy" and "offline" ask for -- is a change too.
    input.value = '';
    if (file) {
      foldLists();   // ticket OPS-20 D10: a file chosen or taken is a pick; a cancelled picker is not
      const r = startRun(CONTROL_OF_INPUT.get(input), null, tapAt === null ? performance.now() : tapAt);
      if (tapAt !== null) mark(r, 'pick_ms', tapAt);
    }
    tapAt = null;
    choose(file, null, run);
  });
}

// The two lists above the photo (ticket OPS-20): the format chips, folded from load (D5), and the example row, in full
// until the first pick (D1). Each button opens and folds only its own list, its arrow and aria-expanded saying which
// (D4, D11); neither is disabled while a photo is in flight, since opening a list sends nothing.
let picked = false;

function setOpen(toggle, open) {
  document.getElementById(toggle.getAttribute('aria-controls')).hidden = !open;
  toggle.setAttribute('aria-expanded', String(open));
  toggle.querySelector('.arrow').textContent = open ? '▾' : '▸';
}
for (const toggle of [formatsToggle, examplesToggle]) {
  toggle.addEventListener('click', () => setOpen(toggle, toggle.getAttribute('aria-expanded') !== 'true'));
}

// Every pick folds both lists, at the pick (D2, D8), on every screen (D9), and from then on offers "Examples" in the
// row's place.
function foldLists() {
  picked = true;
  setOpen(formatsToggle, false);
  setOpen(examplesToggle, false);
  offerExamples();
}

// "Examples" only over a row that was built (OPS-16 D13: a list that cannot be read shows neither).
function offerExamples() {
  examplesToggle.hidden = exampleRow.childElementCount === 0;
}

// Ticket OPS-17 D2, OPS-21 D8: the camera button on every phone and tablet, iOS and Android. iPadOS Safari reports a
// Mac by default, told apart by its touch points.
function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
cameraLabel.hidden = !isMobile();
controls.classList.toggle('with-camera', isMobile());

// Ticket OPS-21 D6: Android in the user agent; a tablet asking for the desktop site reports Linux and gets the desktop
// control. Any other phone or tablet keeps iOS's controls (D15).
function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}
// D1, D14: Choose Photo opens the photo picker, Select File a file browser, the camera button the camera.
if (isAndroid()) {
  photoLabel.htmlFor = 'android-photo-input';
  cameraLabel.htmlFor = 'android-camera-input';
  selectFileLabel.hidden = false;
  controls.classList.add('android');
}

// A photo to classify: the visitor's own (example null), or an example photo, which takes the same path as one the
// visitor chose (ticket OPS-16 D9): the same size check, upload, busy retries and "Use full photo instead".
function choose(file, example, r) {
  clearPhoto();
  if (!file) return;
  lastFile = file;
  lastExample = example;
  const t = performance.now();
  const tooLarge = file.size > MAX_UPLOAD_BYTES;
  mark(r, 'size_check_ms', t);
  if (tooLarge) {
    // Rounded up, so a photo just over the limit never reads as exactly the limit.
    const mb = Math.ceil(file.size / 2 ** 20 * 10) / 10;
    renderRefused(`This photo is ${mb.toFixed(1)} MB; the limit is ${MAX_UPLOAD_BYTES / 2 ** 20} MB.`);
    lastFile = lastExample = null;
    endRun('refused_on_page', r);
    return;
  }
  analyze(file, false, example, r);
}

// The photo on the page, and what was shown for it, gone: a new pick starts clean, and an answer still coming for
// the old one is dropped (its upload token is no longer current).
function clearPhoto() {
  currentUpload++;
  resultEl.innerHTML = '';
  hide(previewWrap, imageClip, cropOverlay, tintCanvas, outlineCanvas, outlineLabel, cropNote, cropToggleBtn);
  lastCropBox = null;
  lastMask = null;
  lastFile = lastExample = null;
}

// The example row (ticket OPS-16 D10, D13): one button per example in /examples/examples.json, its WebP thumbnail
// (D7) captioned with its setting only; the truth waits for the answer. A list that cannot be read leaves the row
// hidden.
async function loadExamples() {
  let examples;
  try {
    const res = await fetch('/examples/examples.json');
    if (!res.ok) return;
    examples = (await res.json()).examples;
  } catch (err) {
    return;
  }
  for (const example of examples) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'example';
    const img = document.createElement('img');
    img.src = `/examples/${example.name}.webp`;
    img.alt = example.caption;
    img.loading = 'lazy';
    const caption = document.createElement('span');
    caption.textContent = example.caption;
    button.append(img, caption);
    button.addEventListener('click', () => chooseExample(example));
    // A list that comes in while a photo is in flight: its buttons wait like the rest (OPS-7 D4), since "Examples"
    // can open the row then (ticket OPS-20).
    button.disabled = fileInput.disabled;
    exampleRow.append(button);
  }
  // A list that comes in after the first pick offers its button and leaves the row folded (ticket OPS-20 D1).
  if (picked) offerExamples();
  else examplesEl.hidden = false;
}

// A click (D9): the example's JPEG XL fetched from the front, then uploaded as a chosen file. The browser need not
// be able to show a JPEG XL: the page shows the server's JPEG thumbnail (D7).
async function chooseExample(example) {
  const r = startRun('example', example, performance.now());
  foldLists();    // ticket OPS-20 D10: at the click, before the download, where a visitor's own photo's wait is
  clearPhoto();   // while the example downloads, nothing of the last photo stays to be clicked
  const pick = currentUpload;
  setBusy(true);
  let file;
  try {
    const res = await fetch(`/examples/${example.name}.jxl`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    file = new File([await res.blob()], `${example.name}.jxl`, {type: 'image/jxl'});
  } catch (err) {
    if (pick === currentUpload) {
      setBusy(false);
      renderRefused(UNREACHABLE);
      endRun('download_failed', r);
    }
    return;
  }
  if (pick !== currentUpload) return;
  mark(r, 'download_ms', r.t0);
  choose(file, example, r);
}

loadExamples();

// While a photo is in flight (OPS-7 D3, D4): the circle spins and every photo control is disabled
// (tickets OPS-17, OPS-21), since the single worker keeps running a photo even when
// the page gives up on it, so a second pick could only meet a 503.
function setBusy(busy) {
  for (const input of pickInputs) input.disabled = busy;
  for (const label of pickLabels) label.classList.toggle('disabled', busy);
  for (const button of exampleRow.querySelectorAll('button')) button.disabled = busy;   // ticket OPS-16, as OPS-7 D4
  spinner.style.display = busy ? 'block' : 'none';
  if (!busy) showSending(false);
}

function showSending(on) {
  progressNote.textContent = on ? SENDING : '';
  progressNote.style.display = on ? 'block' : 'none';
}

// One upload to POST /analyze (ticket OPS-7, ADR 0023); its answer streams
// back as one JSON object per line: the preview part, then the classification
// part, or an error part (D8). For an example photo, the classification is followed by its truth (OPS-16 D10).
// `r` is the photo's timeline (OPS-3), marked as the photo goes and ended with its outcome; an answer that has gone
// stale leaves it alone, since the pick that made it stale ended it as abandoned.
async function analyze(file, skipCrop, example, r) {
  const upload = ++currentUpload;
  const isStale = () => upload !== currentUpload;
  setBusy(true);
  try {
    const res = await postAnalyze(file, skipCrop, isStale, r);
    if (isStale()) return;
    if (!res.ok) {
      // Before the stream: a JSON error from the front (busy, offline, too
      // large, not an image) or the app (an unreadable photo), or the
      // classifier's own busy 503, an HTML page (ticket OPS-15).
      const data = await res.json().catch(() => ({}));
      if (isStale()) return;
      renderRefused(refusalFor(res.status, data));
      // Ticket OPS-20 D6: the chips open in their place, right above this refusal, the preview being hidden.
      if (res.status === 400 && String(data.error || '').startsWith(UNREADABLE_ERROR)) {
        setOpen(formatsToggle, true);
      }
      endRun(refusalOutcome(res.status, data), r);
      return;
    }
    let previewPart = null, answered = false;
    for await (const part of res.parts()) {
      if (isStale()) return;
      showSending(false);
      const arrived = performance.now();
      if (part.part === 'preview') {
        mark(r, 'to_preview_ms', r.sentAt);
        previewPart = part;
        await showPreview(part, isStale);
        if (isStale()) return;
        mark(r, 'preview_drawn_ms', arrived);
      } else if (part.part === 'classification') {
        mark(r, 'to_answer_ms', r.sentAt);
        answered = true;
        render(part);
        if (example) renderTruth(example);
        // D1: only if the whole photo was not already used.
        if (!skipCrop && previewPart && previewPart.cropped && !previewPart.seg_fallback) {
          cropToggleBtn.style.display = 'block';
        }
        mark(r, 'answer_shown_ms', arrived);
        endRun('answered', r);
      } else if (part.part === 'error') {
        answered = true;
        renderRefused(part.message);
        endRun('failed', r);
      }
    }
    // R4: a stream cut before its second part (a dropped connection, the
    // worker killed at 30 s) is not left waiting.
    if (!answered && !isStale()) {
      renderRefused(UNREACHABLE);
      endRun('cut', r);
    }
  } catch (err) {
    if (!isStale()) {
      renderRefused(UNREACHABLE);
      const last = r.attempts[r.attempts.length - 1];
      if (last && last.status) endRun('cut', r);   // the answer had begun
      else endRun('unreachable', r);
    }
  } finally {
    if (!isStale()) setBusy(false);
  }
}

// What a refusal before the stream says. A 503 is busy unless the front says
// the classifier is offline (ticket OPS-15 D12).
function refusalFor(status, data) {
  if (status === 503) return data.error === OFFLINE_ERROR ? OFFLINE : BUSY;
  return data.error || 'Something went wrong -- try a different photo.';
}

// The same refusal, as the timeline's outcome.
function refusalOutcome(status, data) {
  if (status === 503) return data.error === OFFLINE_ERROR ? 'offline' : 'busy';
  return 'refused';
}

// The upload, sent again after each of BUSY_RETRY_S's waits while nginx
// answers busy (plan Q1); the last answer, whatever it is, goes back. An
// offline 503 goes back at once (ticket OPS-15 D12).
// Each attempt goes into the photo's timeline `r` (steps 4-6): its start, when its upload left, when its status came
// with the front's request ID, and the busy wait after it.
async function postAnalyze(file, skipCrop, isStale, r) {
  for (let attempt = 0; ; attempt++) {
    const form = new FormData();
    form.append('photo', file);
    if (skipCrop) form.append('skip_crop', '1');
    const a = {start: performance.now(), sentAt: null, headersAt: null, status: 0, requestId: null, waitMs: null};
    a.done = new Promise(resolve => { a.end = resolve; });
    r.attempts.push(a);
    const res = await send(form, () => {
      a.sentAt = r.sentAt = performance.now();
      if (!isStale()) showSending(true);
    }, (status, id) => {
      a.headersAt = performance.now();
      a.status = status;
      a.requestId = REQUEST_ID.test(id || '') ? id : null;
    }, () => a.end());
    if (res.status !== 503 || attempt >= BUSY_RETRY_S.length || isStale()) return res;
    if ((await res.json().catch(() => ({}))).error === OFFLINE_ERROR) return res;
    showSending(false);
    const waited = performance.now();
    await new Promise(resolve => setTimeout(resolve, BUSY_RETRY_S[attempt] * 1000));
    a.waitMs = performance.now() - waited;
    if (isStale()) return res;
  }
}

// One upload by XMLHttpRequest, not fetch (ticket OPS-15 D16): only it says
// when the upload has left the browser (onSent), and from then on the wait is
// the photo crossing to the classifier, then the model. Resolves once the
// status is in, like fetch, with the answer still arriving: json() waits for
// the whole body; parts() yields the answer's lines as they complete
// (ADR 0023), from responseText, which grows as each line arrives. A network
// failure rejects before the status, and makes parts() throw after it, as
// fetch and its body's stream did. onHeaders(status, X-Request-Id) runs once, when the status is in, and onEnd when
// the request has ended, however it ended.
function send(form, onSent, onHeaders, onEnd) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    let ended = false, failed = false, wake = null, headed = false;
    const headers = () => {
      if (headed || !xhr.status) return;
      headed = true;
      onHeaders(xhr.status, xhr.getResponseHeader('X-Request-Id'));
    };
    const changed = () => {
      if (wake) { const w = wake; wake = null; w(); }
    };
    const done = new Promise(r => xhr.addEventListener('loadend', r));
    done.then(onEnd);
    const answer = {
      get status() { return xhr.status; },
      get ok() { return xhr.status >= 200 && xhr.status < 300; },
      json: () => done.then(() => JSON.parse(xhr.responseText)),
      async *parts() {
        let taken = 0;
        for (;;) {
          // `ended` read with the text: once the request has ended, the text is all of it.
          const text = xhr.responseText, finished = ended;
          let nl;
          while ((nl = text.indexOf('\n', taken)) >= 0) {
            const line = text.slice(taken, nl);
            taken = nl + 1;
            if (line.trim()) yield JSON.parse(line);
          }
          if (finished) {
            if (failed) throw new Error('the answer was cut off');
            if (text.slice(taken).trim()) yield JSON.parse(text.slice(taken));
            return;
          }
          // More may have come in while a part was being shown: read it before waiting for the next event.
          if (xhr.responseText.length === text.length && !ended) await new Promise(r => { wake = r; });
        }
      },
    };
    xhr.upload.addEventListener('load', onSent);
    xhr.addEventListener('readystatechange', () => {
      if (xhr.readyState >= XMLHttpRequest.HEADERS_RECEIVED && xhr.status) {
        headers();
        resolve(answer);
      }
    });
    xhr.addEventListener('progress', changed);
    xhr.addEventListener('load', () => { ended = true; headers(); resolve(answer); changed(); });
    for (const type of ['error', 'abort', 'timeout']) {
      xhr.addEventListener(type, () => {
        ended = failed = true;
        reject(new Error(`the upload failed (${type})`));   // nothing, once the status is in
        changed();
      });
    }
    xhr.open('POST', '/analyze');
    xhr.send(form);
  });
}

// The preview part (D8): the server's JPEG thumbnail, never the file itself
// -- browsers other than Safari cannot show a HEIC, and none a RAW -- and the
// photo's bean region. Both decode first, so the photo, the box and the bean
// region appear together. A mask that fails to decode shows the box only; on
// skip_crop the mask and the box are null and the overlay stays hidden (D9).
async function showPreview(part, isStale) {
  const src = `data:image/jpeg;base64,${part.thumbnail}`;
  const thumb = new Image();
  thumb.src = src;
  await thumb.decode();
  let mask = null;
  if (part.mask) {
    const img = new Image();
    img.src = `data:image/png;base64,${part.mask}`;
    try {
      await img.decode();
      mask = img;
    } catch (err) {
      // box only
    }
  }
  if (isStale()) return;
  lastCropBox = part.cropped ? part.box : null;
  lastMask = mask;
  preview.onload = renderOverlay;
  preview.src = src;
  previewWrap.style.display = 'block';
  renderOverlay();
  // The two notes cannot fire together: a segmenter model's needs_review is
  // always false (coffeecv/infer.py).
  if (part.seg_fallback) {
    // ML-2 D18: no usable mask, so the whole photo is classified. A note,
    // not a refusal (OPS-6 D5; wording OPS-7 D14).
    cropNote.textContent = 'No coffee beans found -- the whole photo is classified.';
    cropNote.style.display = 'block';
  } else if (part.needs_review) {
    cropNote.textContent = 'Framing looks a bit uncertain -- classification will still run.';
    cropNote.style.display = 'block';
  }
}

function renderRefused(message) {
  resultEl.innerHTML = `<div class="result-box refused">${escapeHtml(message)}</div>`;
}

// Under the answer, once it is in (ticket OPS-16 D10): never before, so the visitor sees the model's answer first.
function renderTruth(example) {
  resultEl.insertAdjacentHTML('beforeend', `<div class="result-box truth">${escapeHtml(truthFor(example))}</div>`);
}

function render(data) {
  if (data.verdict === 'refused_scale' || data.verdict === 'refused_ood' || data.verdict === 'refused_unreadable') {
    renderRefused(data.message);
    return;
  }

  let html = '';
  if (data.verdict === 'warned' && data.warning) {
    html += `<div class="result-box warned">${escapeHtml(data.warning)}</div>`;
  }

  const maxScore = Math.max(...data.ranked.map(r => r.score));
  html += '<div class="card"><table>';
  for (const r of data.ranked) {
    const pct = (r.score * 100).toFixed(1);
    const barPct = maxScore > 0 ? (r.score / maxScore * 100) : 0;
    html += `<tr>
      <td class="label">${escapeHtml(r.label)}
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
      </td>
      <td class="score">${pct}%</td>
    </tr>`;
  }
  html += '</table></div>';
  resultEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
