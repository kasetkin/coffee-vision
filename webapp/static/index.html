<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Bean Origin Classifier</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --fg: #2a1e14;
    --muted: #6b5c4d;
    --accent: #6f4527;
    --accent-fg: #fff;
    --card: #fff;
    --border: #e2d8cb;
    --warn-bg: #fff4e0;
    --warn-fg: #6b4c00;
    --refuse-bg: #fdecec;
    --refuse-fg: #7a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1611;
      --fg: #f1e9df;
      --muted: #b8a996;
      --accent: #c68a4e;
      --accent-fg: #1b1611;
      --card: #26201a;
      --border: #3a3025;
      --warn-bg: #3a2e12;
      --warn-fg: #ffd98a;
      --refuse-bg: #3a1c1c;
      --refuse-fg: #ff9d9d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 32rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; text-align: center; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  button, .file-btn {
    flex: 1;
    min-width: 8rem;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-fg);
    text-align: center;
  }
  button:disabled, .file-btn.disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=file] { display: none; }
  .formats-hint {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.25rem 0.6rem;
    margin-top: 0.6rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .formats-hint span {
    white-space: nowrap;
    padding: 0.1rem 0.5rem;
    border-radius: 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  #preview-wrap {
    display: none;
    position: relative;
    overflow: hidden;
    border-radius: 0.5rem;
    margin-top: 1rem;
  }
  #preview {
    display: block;
    width: 100%;
    max-height: 20rem;
    object-fit: contain;
  }
  /* object-fit: contain can letterbox #preview inside #preview-wrap (when
     the photo's aspect ratio doesn't match the wrapper's) -- #image-clip is
     a CSS clipping box sized in JS to exactly the rendered photo's own rect,
     not the wrapper's, so the tint, the outline and the box only ever cover
     actual photo pixels, never empty letterbox space. */
  #image-clip {
    position: absolute;
    display: none;
    overflow: hidden;
    pointer-events: none;
  }
  /* The photo's bean region (ticket OPS-6): #tint-canvas tints everything
     outside it, #outline-canvas draws a thin magenta line just outside its
     edge. Both are drawn by drawBeanRegion() and sit under the box. */
  #tint-canvas, #outline-canvas {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
  }
  #crop-overlay {
    position: absolute;
    display: none;
    /* The crop box as an outline only: #tint-canvas does the dimming, by
       the bean region rather than by the box (OPS-6 D3). */
    outline: 2px solid rgba(255, 255, 255, 0.9);
    /* TODO(crop editing): planned feature -- let the user drag/resize this
       box after the detector shows it, instead of only the binary
       use-detected-crop/use-full-photo toggle below. Needs: pointer-events
       auto + resize handles here (currently `none`, deliberately, since the
       box is display-only today); converting the user's edited on-screen
       rect back to fractional image coordinates (invert renderOverlay's
       contain-fit math); and a new field alongside the existing `skip_crop`
       form field on POST /analyze (e.g. `crop_box`) for classify_one() to
       apply -- same trust boundary as today: the server decides what "apply
       this box" means, the client only ever supplies numbers, same as
       skip_crop is one bit today, not a box. The server holds no photo
       between requests (ADR 0023), so an edited box is a second upload of
       the photo, carrying the edit, as "Use full photo instead" is. */
  }
  #outline-label {
    display: none;
    width: fit-content;
    margin: 0.5rem auto 0;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
  }
  #crop-note {
    display: none;
    margin-top: 0.4rem;
    color: var(--warn-fg);
    font-size: 0.85rem;
    text-align: center;
  }
  #crop-toggle-btn {
    display: none;
    width: fit-content;
    margin: 0.5rem auto 0;
    padding: 0.3rem 0.8rem;
    border-radius: 1rem;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 500;
    flex: none;
    min-width: 0;
  }
  /* The rotating progress circle (ticket OPS-7 D3): from the pick until the
     preview, then under the preview until the classification. */
  #spinner {
    display: none;
    width: 2rem;
    height: 2rem;
    margin: 1rem auto 0;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #spinner { animation-duration: 2.5s; } }
  .result-box {
    padding: 0.9rem 1rem;
    border-radius: 0.5rem;
    margin-top: 0.5rem;
    line-height: 1.4;
  }
  .result-box.refused { background: var(--refuse-bg); color: var(--refuse-fg); }
  .result-box.warned { background: var(--warn-bg); color: var(--warn-fg); margin-bottom: 0.75rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  td { padding: 0.4rem 0.2rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  td.label { color: var(--fg); }
  td.score { text-align: right; color: var(--muted); white-space: nowrap; }
  tr:first-child td { font-weight: 700; color: var(--fg); }
  .bar-track { background: var(--border); border-radius: 3px; height: 6px; margin-top: 4px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
</style>
</head>
<body>
<main>
  <h1>Coffee Bean Origin Classifier</h1>

  <div class="card">
    <div class="controls">
      <label id="photo-label" class="file-btn" for="photo-input">Choose Photo</label>
    </div>
    <div class="formats-hint">
      <span>JPG</span><span>PNG</span><span>WEBP</span><span>HEIC/HEIF</span>
      <span>AVIF</span><span>JPEG XL/JXL</span><span>RAW (DNG, CR2, NEF, ARW, &hellip;)</span>
    </div>
    <input id="photo-input" type="file"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,image/jxl,image/x-adobe-dng,image/x-canon-cr2,image/x-canon-cr3,image/x-nikon-nef,image/x-sony-arw,image/x-fuji-raf,image/x-olympus-orf,image/x-panasonic-rw2,.jpg,.jpeg,.png,.webp,.heic,.heif,.avif,.jxl,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.pef,.srw"
           capture="environment">
    <div id="preview-wrap">
      <img id="preview" alt="Selected photo preview">
      <div id="image-clip">
        <canvas id="tint-canvas"></canvas>
        <canvas id="outline-canvas"></canvas>
        <div id="crop-overlay"></div>
      </div>
    </div>
    <label id="outline-label"><input id="outline-toggle" type="checkbox" checked> Show outline</label>
    <button id="crop-toggle-btn" type="button"></button>
    <div id="crop-note"></div>
    <div id="spinner" role="status" aria-label="Working"></div>
  </div>

  <div id="result"></div>
</main>

<script>
const fileInput = document.getElementById('photo-input');
const preview = document.getElementById('preview');
const previewWrap = document.getElementById('preview-wrap');
const imageClip = document.getElementById('image-clip');
const tintCanvas = document.getElementById('tint-canvas');
const outlineCanvas = document.getElementById('outline-canvas');
const outlineLabel = document.getElementById('outline-label');
const outlineToggle = document.getElementById('outline-toggle');
const cropOverlay = document.getElementById('crop-overlay');
const cropNote = document.getElementById('crop-note');
const cropToggleBtn = document.getElementById('crop-toggle-btn');
const photoLabel = document.getElementById('photo-label');
const spinner = document.getElementById('spinner');
const resultEl = document.getElementById('result');

let lastCropBox = null; // [x0, y0, x1, y1] as fractions of the full image, or null
// The photo's bean region from the preview part (ticket OPS-6 D7): the decoded
// mask image, opaque on bean pixels and transparent elsewhere, covering the
// whole photo; or null (no mask, or not decoded yet).
let lastMask = null;
// The photo on the page, for "Use full photo instead" (ticket OPS-7 D1), which
// uploads it again: the server keeps nothing between requests (ADR 0023).
let lastFile = null;

const UNREACHABLE = 'Could not reach the server -- check your connection and try again.';
const BUSY = 'The server is busy with another photo -- try again in a few seconds.';
// Ticket OPS-7 plan Q1 (open; the plan assumes its recommendation): nginx
// answers 503 at once while another visitor's photo is in flight, so a 503
// is retried after these waits, the circle spinning, before BUSY shows.
const BUSY_RETRY_S = [3, 6, 12];

function hide(...elements) {
  for (const el of elements) el.style.display = 'none';
}

// "Use full photo instead" (ticket OPS-7 D1, D14): shown after a
// classification of a cropped photo; it classifies the whole photo, with one
// more upload, and does not come back. Going back to the cropped answer means
// picking the photo again.
cropToggleBtn.textContent = 'Use full photo instead';
cropToggleBtn.addEventListener('click', () => {
  if (!lastFile) return;
  resultEl.innerHTML = '';
  lastCropBox = null;
  lastMask = null;
  renderOverlay();
  hide(cropToggleBtn, cropNote);
  analyze(lastFile, true);
});

// The overlay is positioned in *displayed* pixels, but #preview uses
// object-fit: contain -- the image is letterboxed inside its own box
// whenever the container's aspect ratio doesn't match the photo's. A plain
// CSS-percentage overlay would misalign in that case, so this maps fractional
// crop coordinates through the same contain-fit math the browser uses.
// #image-clip is sized to exactly the rendered photo's own rect (not the
// wrapper's) so the tint, the outline and the box only ever cover actual
// photo pixels, never the letterbox margin around it. The one place that
// draws: it runs on the preview's load, on the preview part and on resize,
// and draws the bean region only once both the preview and the mask loaded.
function renderOverlay() {
  if (!lastCropBox || !preview.naturalWidth) {
    hide(imageClip, outlineLabel);
    return;
  }
  const cw = previewWrap.clientWidth, ch = previewWrap.clientHeight;
  const iw = preview.naturalWidth, ih = preview.naturalHeight;
  const scale = Math.min(cw / iw, ch / ih);
  const dispW = iw * scale, dispH = ih * scale;
  const offX = (cw - dispW) / 2, offY = (ch - dispH) / 2;
  imageClip.style.left = `${offX}px`;
  imageClip.style.top = `${offY}px`;
  imageClip.style.width = `${dispW}px`;
  imageClip.style.height = `${dispH}px`;
  imageClip.style.display = 'block';

  const [x0, y0, x1, y1] = lastCropBox;
  cropOverlay.style.left = `${x0 * dispW}px`;
  cropOverlay.style.top = `${y0 * dispH}px`;
  cropOverlay.style.width = `${(x1 - x0) * dispW}px`;
  cropOverlay.style.height = `${(y1 - y0) * dispH}px`;
  cropOverlay.style.display = 'block';

  if (lastMask) {
    drawBeanRegion(dispW, dispH);
    tintCanvas.style.display = 'block';
    applyOutlineToggle();
    outlineLabel.style.display = 'block';
  } else {
    hide(tintCanvas, outlineCanvas, outlineLabel);
  }
}
window.addEventListener('resize', renderOverlay);

// "Show outline" (OPS-6 D9) shows or hides the outline's canvas only, with
// no redraw; its state lasts across uploads in this page visit, not saved.
function applyOutlineToggle() {
  outlineCanvas.style.display = outlineToggle.checked ? 'block' : 'none';
}
outlineToggle.addEventListener('change', applyOutlineToggle);

const OUTLINE_CSS_PX = 2;
const OUTLINE_STEPS = 16;

// Ticket OPS-6 D14: composited from the mask, never read back pixel by
// pixel (the noise some browsers add to readback cannot reach the overlay).
// The canvas covers the photo's displayed rect at device pixels, and every
// drawImage stretches the mask to the whole canvas, as the box's fractions
// are stretched to the same rect (D7).
function drawBeanRegion(dispW, dispH) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(dispW * dpr)), h = Math.max(1, Math.round(dispH * dpr));
  for (const canvas of [tintCanvas, outlineCanvas]) {
    canvas.width = w;   // setting the size also clears the canvas
    canvas.height = h;
    canvas.style.width = `${dispW}px`;
    canvas.style.height = `${dispH}px`;
  }

  // The tint (D4): 55% black everywhere, then the bean region cut out.
  const tint = tintCanvas.getContext('2d');
  tint.fillStyle = 'rgba(0, 0, 0, 0.55)';
  tint.fillRect(0, 0, w, h);
  tint.globalCompositeOperation = 'destination-out';
  tint.drawImage(lastMask, 0, 0, w, h);
  tint.globalCompositeOperation = 'source-over';

  // The outline (D9, D14): the mask at 16 offsets on a circle of 2 CSS px is
  // the bean region widened by 2 px; cutting the mask itself out leaves a
  // ring just outside its edge, over the tint and covering no bean pixel
  // (D2); source-in paints the ring magenta, as the review tool's
  // (coffeecv/seg_overlay.py). What lies beyond the canvas is cut off, so the
  // photo's own border never gets a line.
  const outline = outlineCanvas.getContext('2d');
  const r = OUTLINE_CSS_PX * dpr;
  for (let i = 0; i < OUTLINE_STEPS; i++) {
    const a = 2 * Math.PI * i / OUTLINE_STEPS;
    outline.drawImage(lastMask, r * Math.cos(a), r * Math.sin(a), w, h);
  }
  outline.globalCompositeOperation = 'destination-out';
  outline.drawImage(lastMask, 0, 0, w, h);
  outline.globalCompositeOperation = 'source-in';
  outline.fillStyle = 'rgb(255, 0, 255)';
  outline.fillRect(0, 0, w, h);
  outline.globalCompositeOperation = 'source-over';
}

// Ticket OPS-6 D13: each upload has a token, and an answer for an upload
// that is no longer the current one is dropped before it touches the page.
// Choose Photo is disabled while a photo is in flight (OPS-7 D4), so this is a
// guard, not the main defence.
let currentUpload = 0;

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  currentUpload++;
  resultEl.innerHTML = '';
  hide(previewWrap, imageClip, cropOverlay, tintCanvas, outlineCanvas, outlineLabel, cropNote, cropToggleBtn);
  lastCropBox = null;
  lastMask = null;
  lastFile = file || null;
  if (file) analyze(file, false);
});

// While a photo is in flight (OPS-7 D3, D4): the circle spins and Choose
// Photo is disabled, since the single worker keeps running a photo even when
// the page gives up on it, so a second pick could only meet a 503.
function setBusy(busy) {
  fileInput.disabled = busy;
  photoLabel.classList.toggle('disabled', busy);
  spinner.style.display = busy ? 'block' : 'none';
}

// One upload to POST /analyze (ticket OPS-7, ADR 0023); its answer streams
// back as one JSON object per line: the preview part, then the classification
// part, or an error part (D8).
async function analyze(file, skipCrop) {
  const upload = ++currentUpload;
  const isStale = () => upload !== currentUpload;
  setBusy(true);
  try {
    const res = await postAnalyze(file, skipCrop, isStale);
    if (isStale()) return;
    if (!res.ok) {
      // Before the stream: nginx's 503 (an HTML page), or the app's 400 with
      // a JSON error (an unreadable photo).
      const data = res.status === 503 ? {} : await res.json().catch(() => ({}));
      if (isStale()) return;
      renderRefused(res.status === 503 ? BUSY : (data.error || 'Something went wrong -- try a different photo.'));
      return;
    }
    let previewPart = null, answered = false;
    for await (const part of readParts(res)) {
      if (isStale()) return;
      if (part.part === 'preview') {
        previewPart = part;
        await showPreview(part, isStale);
        if (isStale()) return;
      } else if (part.part === 'classification') {
        answered = true;
        render(part);
        // D1: only if the whole photo was not already used.
        if (!skipCrop && previewPart && previewPart.cropped && !previewPart.seg_fallback) {
          cropToggleBtn.style.display = 'block';
        }
      } else if (part.part === 'error') {
        answered = true;
        renderRefused(part.message);
      }
    }
    // R4: a stream cut before its second part (a dropped connection, the
    // worker killed at 30 s) is not left waiting.
    if (!answered && !isStale()) renderRefused(UNREACHABLE);
  } catch (err) {
    if (!isStale()) renderRefused(UNREACHABLE);
  } finally {
    if (!isStale()) setBusy(false);
  }
}

// The upload, sent again after each of BUSY_RETRY_S's waits while nginx
// answers 503 (plan Q1); the last answer, whatever it is, goes back.
async function postAnalyze(file, skipCrop, isStale) {
  for (let attempt = 0; ; attempt++) {
    const form = new FormData();
    form.append('photo', file);
    if (skipCrop) form.append('skip_crop', '1');
    const res = await fetch('/analyze', { method: 'POST', body: form });
    if (res.status !== 503 || attempt >= BUSY_RETRY_S.length || isStale()) return res;
    await new Promise(resolve => setTimeout(resolve, BUSY_RETRY_S[attempt] * 1000));
    if (isStale()) return res;
  }
}

// The answer's lines as they arrive. A line can span chunks, and a character
// can span two, hence the streaming decoder and the carried-over remainder.
async function* readParts(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let pending = '';
  for (;;) {
    const { value, done } = await reader.read();
    pending += done ? decoder.decode() : decoder.decode(value, { stream: true });
    let nl;
    while ((nl = pending.indexOf('\n')) >= 0) {
      const line = pending.slice(0, nl);
      pending = pending.slice(nl + 1);
      if (line.trim()) yield JSON.parse(line);
    }
    if (done) break;
  }
  if (pending.trim()) yield JSON.parse(pending);
}

// The preview part (D8): the server's JPEG thumbnail, never the file itself
// -- browsers other than Safari cannot show a HEIC, and none a RAW -- and the
// photo's bean region. Both decode first, so the photo, the box and the bean
// region appear together. A mask that fails to decode shows the box only; on
// skip_crop the mask and the box are null and the overlay stays hidden (D9).
async function showPreview(part, isStale) {
  const src = `data:image/jpeg;base64,${part.thumbnail}`;
  const thumb = new Image();
  thumb.src = src;
  await thumb.decode();
  let mask = null;
  if (part.mask) {
    const img = new Image();
    img.src = `data:image/png;base64,${part.mask}`;
    try {
      await img.decode();
      mask = img;
    } catch (err) {
      // box only
    }
  }
  if (isStale()) return;
  lastCropBox = part.cropped ? part.box : null;
  lastMask = mask;
  preview.onload = renderOverlay;
  preview.src = src;
  previewWrap.style.display = 'block';
  renderOverlay();
  // The two notes cannot fire together: a segmenter model's needs_review is
  // always false (coffeecv/infer.py).
  if (part.seg_fallback) {
    // ML-2 D18: no usable mask, so the whole photo is classified. A note,
    // not a refusal (OPS-6 D5; wording OPS-7 D14).
    cropNote.textContent = 'No coffee beans found -- the whole photo is classified.';
    cropNote.style.display = 'block';
  } else if (part.needs_review) {
    cropNote.textContent = 'Framing looks a bit uncertain -- classification will still run.';
    cropNote.style.display = 'block';
  }
}

function renderRefused(message) {
  resultEl.innerHTML = `<div class="result-box refused">${escapeHtml(message)}</div>`;
}

function render(data) {
  if (data.verdict === 'refused_scale' || data.verdict === 'refused_ood' || data.verdict === 'refused_unreadable') {
    renderRefused(data.message);
    return;
  }

  let html = '';
  if (data.verdict === 'warned' && data.warning) {
    html += `<div class="result-box warned">${escapeHtml(data.warning)}</div>`;
  }

  const maxScore = Math.max(...data.ranked.map(r => r.score));
  html += '<div class="card"><table>';
  for (const r of data.ranked) {
    const pct = (r.score * 100).toFixed(1);
    const barPct = maxScore > 0 ? (r.score / maxScore * 100) : 0;
    html += `<tr>
      <td class="label">${escapeHtml(r.label)}
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
      </td>
      <td class="score">${pct}%</td>
    </tr>`;
  }
  html += '</table></div>';
  resultEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
