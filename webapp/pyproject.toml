# The web service's environment, and nothing else's: exactly what the release modules import
# (webapp/app.py + the coffeecv modules in webapp/deploy/release_manifest.py), at the versions the production
# venv ran them with (pip freeze of ~/coffee-vision-venv, 2026-09-27). Since ticket ML-7 (D5 (b), plan P10) the
# models run on LiteRT (ai-edge-litert) and the release holds no torch, torchvision, timm or segment-anything:
# serving's pre- and post-processing are coffeecv.model_io's ports, shared with training. Locked in
# webapp/uv.lock; every release's .venv is built from that lock with `uv sync --locked`, which
# verifies each artifact's hash and refuses a lock that no longer matches this file.
#
# Re-lock after any edit here (locally, with the uv version pinned below):
#     uv lock --project webapp
# A version change is a deploy of different numerics: run deploy_webapp.sh --compare before enabling.
# docs/ops1_release_isolation_plan.html §4.1.
[project]
name = "coffee-cv-webapp"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "flask==3.1.3",
  "gunicorn==26.2.0",
  "numpy==2.4.4",
  "pyyaml==6.0.3",
  "pillow==12.2.0",
  "pillow-heif==1.5.0",
  "pillow-avif-plugin==1.6.0",
  "pillow-jxl-plugin==1.3.8",
  "rawpy==0.27.0",
  # Headless: the service never opens a window, and the GUI build needs libGL. Same version as the
  # production venv (which has both builds installed); --compare proves the outputs are identical.
  "opencv-python-headless==5.0.0.93",
  # Ticket ML-7 (ADR 0019): the serving runtime, at the version P2-P8 measured. Its WebGPU accelerator library
  # (ai_edge_litert/libLiteRtWebGpuAccelerator.so) is what the service's GPU runs; a version change is a new
  # measurement (ADR 0020's checks on the serving host).
  "ai-edge-litert==2.3.0",
]

[tool.uv]
package = false
required-version = "==0.12.19"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Everything pulled in transitively, held to the production freeze too (torch's own dependencies left with it).
constraint-dependencies = [
  "blinker==1.9.0", "click==8.4.2", "itsdangerous==2.2.0", "jinja2==3.1.6", "markupsafe==3.0.3",
  "packaging==26.3", "typing-extensions==4.15.0", "werkzeug==3.1.8",
]
