# The LiteRT conversion environment (ticket ML-7 D6, plan P9): coffeecv.export_litert's `convert` step runs here,
# from the dvc.yaml stage litert_export. Apart from the training lock (ADR 0007): litert-torch requires torch below
# 2.14 and training is on 2.14, so the converter gets its own torch (ticket 2.3). The converted files are checked
# against training's torch 2.14 under D7 (export_litert's `finish` step, in the training environment).
# Moved from analysis/ml7_gpu/convert_litert/ in P9, unchanged; P1-P7 converted with this lock.
#     uv lock --project convert
#     UV_PROJECT_ENVIRONMENT=convert/.venv uv sync --locked --project convert
# Set UV_PROJECT_ENVIRONMENT every time: the devcontainer points it at the training venv, so a plain
# `uv sync --project` here would rewrite the training environment to this lock (it did once, in P1).
[project]
name = "coffee-cv-convert"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.13.*",
  "torchvision",
  "timm==1.0.30",
  "numpy",
  "pyyaml",
  "pillow",
  # coffeecv.infer, which builds the models as serving does, imports the photo decoders: webapp/pyproject.toml's
  "pillow-heif",
  "pillow-avif-plugin==1.6.0",
  "pillow-jxl-plugin==1.3.8",
  "rawpy",
  "opencv-python-headless",
  "segment-anything==1.0",
  # It brings the ai-edge-litert it was built against (below 2.3.0); the CPU check runs the 2.3.0 runtime
  # that plan P2 takes to yappy, from ../run_litert.
  "litert-torch==0.9.4",
]

[tool.uv]
package = false
required-version = "==0.12.19"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# As in the training pyproject: timm without huggingface_hub/safetensors.
[[tool.uv.dependency-metadata]]
name = "timm"
version = "1.0.30"
requires-dist = ["torch", "torchvision", "pyyaml"]
